# Machine Politics position-coding rubric.
# Drafted by tooling, awaiting analyst review. Nothing here renders on the
# public site until approved: true. The analyst of record is Walker Robinson.
approved: true
version: 0.2-draft
updated: 2026-08-24

axis_a:
  name: Instrument preference
  question: >
    What kind of international instrument, if any, does this state support
    for autonomous weapons systems?
  rules: >
    Categories are mutually exclusive at a dated point in time. A state holds
    exactly one coding on a given date. When the record supports two readings,
    the coding is AMBIG, and the evidence shows both readings. AMBIG is a
    finding about the record, not a coding failure.
  categories:
    LBI-BAN:
      label: Binding instrument with prohibitions
      description: >
        The state supports a legally binding international instrument that
        includes prohibitions. This covers both a full ban and the two-tier
        approach: prohibit some systems, regulate the rest.
    LBI-OPEN:
      label: Binding instrument, form open
      description: >
        The state supports negotiating a legally binding instrument but has
        not committed to prohibitions. The form of the instrument stays open
        in its statements.
    REG-SOFT:
      label: New non-binding measures
      description: >
        The state supports new international measures that are not legally
        binding: political declarations, codes of conduct, or guidelines.
    CCW-ONLY:
      label: CCW process only
      description: >
        The state supports continuing the consensus process in the Convention
        on Certain Conventional Weapons and its Group of Governmental Experts.
        It leaves open what that process should produce.
    OPPOSE:
      label: Opposes new instruments
      description: >
        The state opposes new international instruments on autonomous weapons.
        Its stated view is that existing international humanitarian law
        suffices.
    AMBIG:
      label: Ambiguous or evolving
      description: >
        The record supports more than one reading, or the position is moving.
        A first-class category. The evidence entries show the tension rather
        than hiding it.
    NONE:
      label: No substantive position on record
      description: >
        This project reviewed the record and found no substantive stated
        position. This is a coverage finding about the record, not a claim
        that the state holds no view.

axis_b:
  name: Confidence
  rules: >
    Confidence describes how directly the evidence supports the coding. It
    modulates visual saturation and a dotted-underline convention on the
    site. It never changes the category hue.
  tiers:
    EXPLICIT: >
      The state says it directly, in an official statement or document, in
      words a careful reader cannot mistake. Authoring a draft instrument
      counts, on the terms set out under "Authoring a draft instrument"
      below.
    INFERRED: >
      The coding rests on interpretation: voting behavior, sponsorship,
      alignment statements, or untranslated sources described rather than
      quoted.
    AMBIGUOUS: >
      The record points in more than one direction and the coding marks the
      best-supported reading of an unclear record.
    PROVISIONAL: >
      The coding rests on secondary reporting of a primary record this
      project has not yet retrieved and verified. A provisional coding
      carries a note saying exactly what is pending, and it is upgraded or
      corrected once the primary record is reviewed.

instrument_authorship:
  name: Authoring a draft instrument
  rule: >
    When a state is a named author of a substantive draft treaty text, that
    authorship is read as an explicit statement of the position the text
    takes, and the coding is EXPLICIT. The text itself is the quoted
    evidence.
  why: >
    A draft instrument is the most committing written form available to a
    state in a negotiation. It is not a speech about what should happen; it
    is the operative language the state is asking other states to sign. A
    government that puts its name on an article beginning "It is prohibited
    to develop, produce, possess, acquire, deploy, transfer, or use under any
    circumstances autonomous weapons systems if:" has stated a position on
    prohibition in terms no careful reader can mistake, and has done so more
    concretely than most floor statements manage.
  quote_the_scope: >
    Read the conditions with the verbs, always. The article above prohibits
    conditionally: the conditions that follow its "if" are cumulative, so the
    prohibition reaches systems designed to attack outside meaningful human
    control AND whose use does not comply with international humanitarian
    law, while the rest of the instrument regulates. Quoting the verb list
    without the "if" converts a two-tier instrument into a blanket ban and
    overstates the author's position. This site quotes the trigger with the
    prohibition, or quotes the condition as its own evidence entry beside it.
  limits: >
    This rule is narrow on purpose, and it is applied symmetrically: it
    reads authorship the same way for a draft that prohibits and for a
    draft that declines to. Three things it does not cover. Co-sponsoring a
    resolution is not authorship, and sponsorship never produces a coding by
    itself. Signing a joint statement is not authorship of an instrument.
    An author who publicly departs from the text it co-authored is coded on
    the later record, and the divergence is shown rather than resolved.
  the_text_is_the_evidence: >
    Authorship evidences the position the text actually states, and nothing
    further. Where a draft states an instrument preference on its face, its
    authors are coded to that preference at EXPLICIT. Where a draft states no
    instrument preference at all, this rule yields no Axis A category, and
    the honest coding is AMBIG with both readings shown, or NONE where the
    rest of the state's record is empty. It is not open to this site to
    supply the missing preference by reading the venue the text was filed in
    or what the text declines to ask for. Those are readings of a silence,
    and a silence can be read in either direction, which is the definition
    of AMBIG rather than a licence to pick one. The same reason the site
    refuses to treat a missing endorsement as opposition applies here.
  tie_break_between_records: >
    A statement in a state's own voice is not overturned by an inference
    drawn from another document's silence. Directness ranks before recency:
    an EXPLICIT record governs an INFERRED one whatever their dates. The
    later-record rule decides between records of equal directness, and a
    later record can only displace an earlier one by saying something.
  reader_check: >
    Every coding made under this rule shows the draft text, the document
    symbol, the date, and the state's name among the authors, so a reader
    who thinks authorship should count for less can see exactly what the
    coding rests on and discount it themselves.

shift_event:
  description: >
    A shift event records a state moving from one Axis A category to another
    on a dated record. Shift events are first-class data. Each one carries
    the evidence that dates the move.
  fields:
    state: ISO 3166-1 alpha-3 key
    date: date of the evidencing record, YYYY-MM-DD
    from: Axis A category before the move
    to: Axis A category after the move
    evidence: list of evidence entries, each resolving to the source registry

evidence_entry:
  description: >
    Every coding and every shift event traces to quoted, dated, linked
    primary sources. These fields are validator-enforced.
  fields:
    source: id in content/sources.yaml
    quote: verbatim, 25 words maximum, only when a citable text exists
    date: document date, YYYY-MM-DD
    url: direct link to the document
    lang: source language code
    translation: official, unofficial, or none
    confidence: >
      EXPLICIT, INFERRED, or AMBIGUOUS. PROVISIONAL is deliberately absent
      here. It is a coding-level tier only, because it describes the state
      of this project's retrieval rather than the strength of a document,
      and an evidence entry always has a document behind it. The validator
      enforces the shorter list at this level.
  rules: >
    A source with no translation cannot yield an English quote. The entry
    describes and links the document instead, and the coding it supports is
    INFERRED at best. The lang field records the original language of the
    underlying document; translation records the provenance of the English
    text quoted. When a state's own official English text is the primary
    record, lang is en and translation is none.

worked_examples:
  - state: USA
    why: >
      An explicit-statement case, and the site's clearest coded shift. The
      recorded vote arc runs Yes on 78/241, Yes on 79/62, No on 80/57, and
      behind it the coding moves from support for non-binding measures to a
      stated preference for keeping the work inside the CCW, dated to the
      explanation of vote that says so.
  - state: AUT
    why: >
      A coded position that moved, and the clearest illustration of why
      sponsorship is not evidence. Austria co-authored a 2018 paper calling
      for negotiation of a binding instrument without committing to
      prohibitions, which is LBI-OPEN, and by 2024 was stating in its own
      submission that it would promote negotiations for an instrument
      consisting of prohibitions and regulations, which is LBI-BAN. Austria
      also sponsored all three resolutions, and none of that sponsorship
      carries any weight in either coding. The statements do the work.
  - state: CHN
    why: >
      The hard case, and the reason AMBIG exists. China's own written papers
      hold two things at once: that general prohibitions would undermine
      legitimate defence capabilities, and that a legal instrument
      prohibiting a narrow class of systems could follow the precedent of
      the Protocol on Blinding Laser Weapons. That narrow class is defined
      by five characteristics a system must have in combination, so the
      prohibition China entertains is far smaller than the word suggests.
      China abstained on all three resolutions. The record supports two
      readings, and the evidence entries show both rather than choosing.
