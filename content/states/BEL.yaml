flags:
  - "as_of is the first statement read that says 'legally binding' in Belgium's own words (October 2026). The October 2024 statement backs a 'legal framework' by 2026, which the analyst may judge enough to date the reading to 2024-10-14."
  - "Possible LBI-BAN: Belgium aligns with EU statements that back the two-tier approach, and it associated with the Vienna 2024 chair's summary (prohibitions plus regulations). Both corroborate only (R3, endorsement rule). No Belgian national text stating prohibitions was found."
  - "Belgium did not file a national reply under 78/241 (not in A/79/88's list; the EU replied). Co-author of CCW/GGE.1/2024/WP.5 (bias paper, no instrument preference) and co-submitter of CCW/MSP/2025/WP.5 (rolling text is a sufficient basis); context only."
  - "Belgium's October 2023 general debate statement backs efforts in the CCW to foster consensus on a normative framework; no instrument stated. CCW GGE statements by Belgium for 2023 to 2026 were not found on the UNODA portal."
  - "Statement days (2024-10-14 on the face; 2025-10-24 and 2026-10-09 from the UNODA portal) should be checked; the 2025 and 2026 faces say only 'October'."
