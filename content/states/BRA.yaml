position_codings:
  - code: LBI-OPEN
    confidence: EXPLICIT
    as_of: 2018-08-30
    approved: false
    rationale: 'Brazil, with Austria and Chile, proposed that the Geneva convention
      open negotiations on a legally binding instrument to ensure meaningful human
      control. The proposal did not say what the instrument should prohibit. This
      is the same document that grounds Austria''s 2018 reading.

      '
    evidence:
      - source: ccw-gge2-2018-wp7-aut-bra-chl
        kind: working_paper
        claim: The 2018 working paper, with Brazil among its three authors, proposes
          a mandate to negotiate a legally binding instrument.
        quote: negotiate a legally-binding instrument to ensure meaningful human
          control over critical functions in lethal autonomous weapon systems
        date: 2018-08-30
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.2/2018/WP.7&l=E
        lang: en
        translation: none
        confidence: EXPLICIT
        note: 'Face re-checked 2026-10-19. The header reads "Submitted by Austria,
          Brazil and Chile". The paper is one operative paragraph and names no prohibitions.

          '
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2021-06-28
    approved: false
    rationale: 'In 2021 Brazil, with Chile and Mexico, set out an outline of a legally
      binding instrument, preferably a new protocol to the Geneva convention, made
      of prohibitions and regulations. Its own 2024 submission to the Secretary-General
      lists prohibitions and says a legally binding instrument should also carry
      regulations. In October 2026 Brazil told the First Committee it wants a legally
      binding instrument with prohibitions and restrictions, negotiated on the basis
      of the expert group''s report. Brazil chaired the expert group in 2022 and
      2023. Its 2023 explanation of vote, given in that role, did not restate a
      preference. Brazil co-sponsored the 2024 resolution; that counts toward nothing
      here.

      '
    evidence:
      - source: ccw-gge-2021-bra-chl-mex-elements
        kind: working_paper
        claim: The 2021 paper by Brazil, Chile and Mexico says the normative framework
          should take the form of a legally binding instrument.
        quote: the normative framework is the priority and should take the form
          of a legally binding instrument.
        date: 2021-06-28
        url: https://documents.unoda.org/wp-content/uploads/2021/06/Brazil-Chile-Mexico.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        note: 'The document carries no date on its face. The date given is the PDF
          creation date (28 June 2021), and the file sits in UNODA''s June 2021
          upload folder, which matches the 2021 written-input round of the expert
          group. The analyst may prefer a different date.

          '
      - source: ccw-gge-2021-bra-chl-mex-elements
        kind: working_paper
        claim: The same paper proposes an outline of an instrument establishing
          prohibitions and regulations, beginning with "States shall" prohibit listed
          classes.
        quote: propose the following outline of a normative framework, conducive
          to an instrument establishing prohibitions and regulations
        date: 2021-06-28
        url: https://documents.unoda.org/wp-content/uploads/2021/06/Brazil-Chile-Mexico.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        note: 'Scope, read with the verbs: the outline''s first item says States
          shall prohibit, among others, AWS "that cannot be used in compliance with
          IHL" and AWS that "cannot be controlled by humans". The rest of the outline
          regulates. This is the two-tier structure, not a blanket ban.

          '
      - source: ccw-gge-2021-bra-chl-mex-elements
        kind: working_paper
        claim: The paper names a new protocol to the Geneva convention as the form
          of the binding norms.
        quote: such a balance can be attained by the development of legally binding
          norms, in the form of a new protocol to the CCW.
        date: 2021-06-28
        url: https://documents.unoda.org/wp-content/uploads/2021/06/Brazil-Chile-Mexico.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: bra-submission-78-241
        kind: submission
        claim: Brazil's own submission says a legally binding instrument should
          carry regulations in addition to the prohibitions it lists.
        quote: In addition to the prohibitions listed above, a legally binding instrument
          on AWS should include positive obligations, in the form of regulations,
        date: 2024-06-12
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Brazil-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        note: 'The submission has no date on its face. The date given is the PDF
          creation date. Brazil''s national submission is not among the individual
          replies printed in the annex to A/79/88 (Brazil appears there only within
          the joint Ibero-American Summit reply dated 24 May 2024), so it was likely
          received after the report closed. The prohibitions it lists are conditional:
          AWS that "cannot be meaningfully controlled by humans", with three listed
          cases.

          '
      - source: bra-submission-78-241
        kind: submission
        claim: Brazil names a new protocol to the Geneva convention as the way to
          meet the need for a legal framework.
        quote: Brazil believes that this need can be met through the negotiation
          of a new protocol to the CCW
        date: 2024-06-12
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Brazil-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: un-c1-81-transcript-7
        kind: statement
        claim: In its October 2026 First Committee statement, Brazil welcomes the
          expert group's report as a basis for negotiating a legally binding instrument
          with prohibitions and restrictions.
        quote: welcomes the consensus report on the GGE on lethal autonomous weapons
          systems as a basis for negotiation, a legally binding instrument establishing
          prohibitions and restrictions
        date: 2026-10-13
        url: https://transcripts.un.org/en/ga/c1/81/7
        lang: en
        translation: none
        confidence: EXPLICIT
        note: 'UN automatic speech recognition transcript, not an official record.
          The statement was delivered in English by Brazil''s Permanent Representative
          to the Conference on Disarmament. The next sentence in the transcript
          reads that Brazil expects the Review Conference "to adopt a mandate for
          negotiations of a protocol" on LAWS (the transcript renders LAWS as "loss"
          and the convention''s name with an error, so it is not quoted). Replace
          with the written statement when one is found.

          '

