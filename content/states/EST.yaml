flags:
  - "JUDGMENT CALL FOR THE ANALYST: CCW-ONLY at INFERRED is the reading of the draft-articles series taken here, on the ground that the text never asks for a legally binding instrument and grounds itself in existing IHL. The competing reading is LBI-OPEN: the series is drafted as articles, the 2023 agenda item invites measures taking into account the example of existing CCW protocols, and protocols are binding. This coding does not follow that reading, because the mandate language is the Group's and not the authors', and the authors themselves never name a binding instrument. Ruling this one way sets it for all nine states and for how GBR and USA authorship is read"
  - "CONFIDENCE, corrected 2026-08-24 in adversarial review: this coding was first drafted EXPLICIT. A search of the WP.7 face returned zero occurrences of forum, legally binding, binding instrument, negotiation or consensus process, so the position is reached from what the text omits plus where it was filed. That is interpretation, and EXPLICIT would have coded an absence as something the state said, which the methodology disclaims. Downgraded to INFERRED"
