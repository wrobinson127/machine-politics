# Estonia: co-author of the draft-articles series, the other camp's
# substantive written text. Coded from draft-instrument authorship under
# the 2026-07-21 rule, applied symmetrically with the ban camp. Faces
# checked 2026-08-24. Nothing renders until the analyst sets approved: true.
iso3: EST
un_name: ESTONIA
display_name: Estonia
coverage_tier: anchor

position_codings:
  - code: CCW-ONLY
    confidence: INFERRED
    as_of: 2025-09-03
    approved: false
    scope_note: >
      Coded from co-authorship of a substantive draft instrument, the same
      rule the ban camp is coded under and applied symmetrically here. Estonia
      is a named author of CCW/GGE.1/2025/WP.7. INFERRED, not EXPLICIT, and the reason
      matters: the draft-articles text states no instrument preference on its
      face. It never uses the words legally binding, binding instrument,
      negotiation, or forum. Reaching a position from it means reading the
      venue it was filed in and what it declines to ask for, which is
      interpretation. The ban camp's texts are EXPLICIT because Draft
      Protocol VI states its instrument preference in its own operative
      articles; this one does not.
    rationale: >
      Estonia co-authored the draft-articles series, a written text submitted
      into the CCW Group of Governmental Experts setting out prohibitions and
      regulatory measures that States are to implement to satisfy
      international humanitarian law as it already stands. Article 1 opens by
      describing what IHL already prohibits, rather than creating a
      prohibition the instrument itself would impose, which is the sharpest
      contrast with Draft Protocol VI. The text asks for no new legally
      binding instrument, and it asks for nothing outside the CCW. Read
      together with the venue, that best supports CCW-ONLY: support for the
      CCW consensus process with the form of its output left open. The
      reading is interpretation and is marked as such. LBI-OPEN would require
      the state to have asked for a binding instrument, and none of these
      texts does.
    evidence:
      - source: ccw-gge1-2025-wp7-draftarticles
        claim: Estonia is a named author of CCW/GGE.1/2025/WP.7, draft articles specifying prohibitions and regulatory measures to satisfy existing IHL.
        quote: "Affirm the following draft articles on the development, deployment, and use of autonomous weapon systems"
        date: 2025-09-03
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.1/2025/WP.7&l=en
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2025-wp7-draftarticles
        claim: The draft articles specify measures for States to implement in order to satisfy international humanitarian law as it already stands, rather than obligations a new instrument would create.
        quote: "which specify prohibitions and other regulatory measures for States to implement to effectively satisfy these IHL requirements in armed conflict"
        date: 2025-09-03
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.1/2025/WP.7&l=en
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          The purpose clause is quoted whole rather than cut after
          "regulatory measures", because the truncated form reads as though
          the articles create prohibitions and would overstate the authors'
          position in the same way a cut excerpt of Draft Protocol VI would
          understate the ban camp's. The wording is carried unchanged through
          every revision of the series and is quoted once here, on the
          earliest text this state authored.

