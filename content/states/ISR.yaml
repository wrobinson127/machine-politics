position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2023-11-01
    approved: true    # analyst approval 2026-10-19, packet item 3
    scope_note: 'Two directions, both in Israel''s own words, shown side by side.
      One points to "no new rules": Israel says IHL is a sufficient legal framework
      for any future use of LAWS, and in 2025 it objected to text suggesting the
      expert group''s work will lead to a legal framework. The other points to "keep
      it in Geneva": Israel supports further work in the CCW expert group toward
      consensus outcomes, under a mandate it describes as elements of an instrument
      without prejudging its nature. Israel has not said, in the records read here,
      whether it opposes or accepts a non-binding outcome.

      '
    rationale: 'Israel says the existing laws of war are a sufficient legal framework
      for these weapons. It also says the Geneva expert group should keep working
      toward consensus outcomes, and it opposes a parallel process. In 2025 it voted
      No and said the resolution wrongly suggested the group''s work would lead
      to a legal framework. These records fit both "no new rules" and "keep it in
      Geneva". Both are shown.

      '
