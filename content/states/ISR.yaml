        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Israel-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        note: 'The UNODA copy carries no date on its face; 24 May 2024 is the date
