position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2026-10-13
    approved: false
    rationale: >
      The Maldives' own words point two ways. In October 2026 it told
      the UN First Committee that autonomous weapons that cannot comply
      with international law must be banned and the rest regulated,
      which points toward a treaty with bans. It did not say whether
      those rules should be legally binding.
    evidence:
      - source: mdv-c1-81-gd-2026
        claim: The Maldives wants non-compliant autonomous weapons banned and the rest regulated.
        quote: "Autonomous weapons whose use cannot comply with international law must be banned and other systems must be regulated to ensure meaningful human control"
        date: 2026-10-13
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eighty-First_session_(2026)/Maldives.pdf
        lang: en
        translation: none
        confidence: INFERRED
        kind: statement
        note: The document is undated; the date is the UNODA listing date for the 81st session general debate.

