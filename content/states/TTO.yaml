position_codings:
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2024-05-31
    approved: true    # analyst approval 2026-10-19, bulk review
    rationale: >
      In its 2024 submission to the UN Secretary-General, Trinidad and
      Tobago called for a legally binding treaty that bans
      uncontrollable autonomous weapons and those designed to use force
      against people, and regulates the rest.
    evidence:
      - source: tto-submission-78-241
        kind: submission
        claim: Trinidad and Tobago calls for negotiating a legally binding instrument that prohibits uncontrollable autonomous weapons.
        quote: "call for negotiations of an international legally binding instrument that prohibits unpredictable or uncontrollable autonomous weapons systems"
        date: 2024-05-31
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Trinidad-and-Tobago-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          No date on the face; the date given is the PDF creation date. The
          reply is not printed in the annex to A/79/88, so it likely arrived
          after the report closed. The same sentence also prohibits systems
          "designed or employed to apply force against persons".
      - source: tto-submission-78-241
        kind: submission
        claim: The same sentence pairs the prohibitions with regulation of all other autonomous weapons, a two-tier instrument.
        quote: "while implementing regulations for other forms of autonomous weapons systems"
        date: 2024-05-31
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Trinidad-and-Tobago-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT

