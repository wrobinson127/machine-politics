position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2024-05-16
    approved: true    # analyst approval 2026-10-19, packet item 8
    rationale: 'Finland''s 2024 submission wants a two-tier approach that combines
      prohibitions and regulations. That points toward a treaty with bans. The same
      submission says the instrument could be either politically or legally binding,
      and that Finland''s aim is an instrument without prejudging its nature, with
      the widest possible group of states. So Finland wants bans but has said in
      its own words that it is open on whether they bind. In November 2025 it joined
      a statement saying future negotiations must not prejudge their outcome. In
      October 2026 it backed further work within the CCW. Finland voted Yes on all
      three UN resolutions.

      '
