flags:
  - "In A/C.1/79/PV.9 Papua New Guinea expressly disassociated itself from the 2024 NAM general-debate statement, saying certain elements were inconsistent with its national position. That weakens any reading built on NAM alignment."
  - "Pacific regional context (Manila 2023 report, SafeGround outreach) records Pacific Island concern about marine and ecological harm, without naming this state; context only."
