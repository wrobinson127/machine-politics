    rationale: 'In its national statement to the First Committee in October 2026,
      Iceland welcomed the expert group''s consensus on elements of an instrument
      without prejudging its nature, and said it wants to advance the work within
      the CCW. It said the use of AI-enabled weapons must stay under meaningful
      human control. It did not say what the instrument should be. The year before,
      Iceland delivered the Nordic statement calling the rolling text a sufficient
      basis for negotiating an instrument at the CCW; that statement spoke for five
      states and does not decide this reading. Iceland voted Yes on all three UN
      resolutions.

      '
