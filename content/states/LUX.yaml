flags:
  - "Luxembourg co-wrote CCW/GGE.1/2024/WP.3 (4 March 2024, existing id ccw-gge1-2024-wp3), which lists prohibitions but does not state the instrument's nature; DNK.yaml codes it AMBIGUOUS. Not used as the start date for that reason; the analyst could consider 2024-03-04 read together with this submission."
  - "Luxembourg's October 2025 First Committee general debate statement (French only, Statement_Luxembourg_French.pdf) says it will keep promoting a double approach to ban fully autonomous systems and regulate the rest, and calls the CCW GGE the most appropriate framework. Consistent, but not quotable under the language rule, so not cited."
  - "Luxembourg also signed the 2025 joint statement led by Australia and others at the May 2025 New York consultations, and CCW/MSP/2025/WP.5; context only."
  - "Date 2024-05-25 is from A/79/88's listing; the file itself is undated (PDF created 28 May 2024)."
