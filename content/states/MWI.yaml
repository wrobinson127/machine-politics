position_codings:
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2024-05-24
    approved: false
    rationale: >
      In its 2024 submission to the UN Secretary-General, Malawi called for
      talks on a legally binding treaty to start as soon as possible. It said
      the treaty should ban unacceptable autonomous weapons, including those
      that target people, and regulate the rest. That is a treaty with bans.
    evidence:
      - source: mwi-submission-78-241
        claim: Malawi calls for negotiations on a legally binding instrument to begin soon.
        quote: "call for the start of negotiations of a legally binding instrument on Autonomous Weapons Systems as soon as possible"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Malawi-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
      - source: mwi-submission-78-241
        claim: Malawi wants the treaty to prohibit some systems and regulate others, the two-tier approach.
        quote: "a treaty is required to prohibit fundamentally unacceptable autonomous weapons systems and regulate the use of other autonomous weapons systems"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Malawi-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
      - source: mwi-submission-78-241
        claim: Malawi names systems that target people as a category to prohibit.
        quote: "This means AWS that target people must also be prohibited for legal and ethical reasons."
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Malawi-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission

