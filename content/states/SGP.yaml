position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2024-05-09
    approved: true    # analyst approval 2026-10-19, bulk review
    rationale: >
      Singapore's own words point two ways. In its 2024 submission it
      backs the two-tier approach: prohibit autonomous weapons that
      cannot be used in line with the laws of war, and limit the rest.
      That points toward a treaty with bans. It wants this worked out in
      the Geneva weapons convention's expert group and has not said the
      result should be legally binding.
    evidence:
      - source: sgp-submission-78-241
        claim: Singapore supports the two-tier approach of prohibitions and regulations.
        quote: 'Singapore supports the "two-tier approach" on the prohibition and regulation of LAWS as agreed at the GGE in 2023.'
        date: 2024-05-09
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Singapore-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
      - source: sgp-submission-78-241
        claim: Singapore says systems that cannot comply with the laws of war should be prohibited.
        quote: "We believe that the use of LAWS that are incapable of being used in compliance with IHL should be prohibited"
        date: 2024-05-09
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Singapore-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
