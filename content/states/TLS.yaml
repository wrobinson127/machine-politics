    rationale: >
      In the UN First Committee's 2025 general debate, Timor-Leste called for
      norms and guidelines to keep humans in control of autonomous systems
      and accountable for their use. Norms and guidelines are not binding
      rules. The call came in one line about military AI, so this reading is
      an interpretation.
