    rationale: >
      In the 2023 First Committee general debate, Equatorial Guinea
      recommended that states adopt new legally binding rules to regulate
      autonomous weapons and keep enough human control over the use of
      force. It did not call for bans. The statement is in Spanish only, so
      this reading is a description, not a quotation.
    evidence:
      - source: gnq-c1-78-general-debate-2023
        claim: Equatorial Guinea recommends new legally binding rules to regulate autonomous weapons systems.
        description: >
          Spanish-only general debate statement. It warns that autonomous
          weapons are spreading with less human supervision, including in
          cities, and recommends that states adopt new legally binding
          norms to regulate autonomous weapons systems so that sufficient
          human control and judgment over the use of force is kept.
        date: 2023-10-11
