  - "RESOLVED 2026-08-24: the March 2023 six-state paper is real and is NOT a conflation of WP.7. CCW/GGE.1/2023/WP.4/Rev.1, 13 March 2023, face-checked: Australia, Canada, Japan, the Republic of Korea, the United Kingdom, the United States. The research pass was right. Rev.2 (15 May 2023) adds Poland; WP.7 (3 September 2025) adds Czechia, Estonia, Latvia and Lithuania"
  - "Co-author of BOTH CCW/GGE.1/2025/WP.7 (eleven-state draft articles) and WP.8 (ten-state joint statement), VERIFIED from document faces 2026-07-17; both in the sponsorship layer"
