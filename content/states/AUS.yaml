# Australia: launch-set coding pass, drafted 2026-07-17 from the research
# passes, which grounded facts and candidates but no primary coding quote.
# Populate pass 2 (2026-08-24) supplies one from Australia's own authored
# text, the draft-articles series, face-checked. It codes AMBIG because that
# text declines to state an instrument preference.
# approved: false throughout; nothing renders without the analyst's flip.
iso3: AUS
un_name: AUSTRALIA
display_name: Australia
coverage_tier: anchor

position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2023-03-13
    approved: true   # render-approved 2026-09-14
    scope_note: >
      Coded from co-authorship of a substantive draft instrument, the same
      rule the ban camp is coded under. Australia is a named author of CCW/GGE.1/2023/WP.4/Rev.1, CCW/GGE.1/2023/WP.4/Rev.2, CCW/GGE.1/2025/WP.7.
      The rule reads the text, and this text declines to state an instrument
      preference: searched on its face, it contains no occurrence of legally
      binding, binding instrument, negotiation, or forum. That is a property
      of the document, not a gap in this project's retrieval, so the rubric
      yields AMBIG rather than a category picked out of the silence.
    rationale: >
      Australia co-wrote a set of draft articles on autonomous weapons at
      the Geneva talks. The document is written like the start of a treaty,
      which points one way. But it never asks for anything new: it spells
      out what the laws of war already require, and its first article
      describes what is already prohibited rather than creating a new ban.
      That points the other way. The text supports both readings and states
      neither. Reading it as "keep it in Geneva" would mean guessing from
      where it was filed; reading it as "wants a treaty" would mean guessing
      from its format. Both are guesses about a silence, so this site marks
      the position unclear and shows both. Australia's own statements would
      settle it; this site has not yet reviewed them.
    evidence:
      - source: ccw-gge1-2023-wp4rev1-draftarticles
        claim: Australia is a named author of CCW/GGE.1/2023/WP.4/Rev.1, and affirms it in the form a treaty takes, as numbered draft articles.
        quote: "Affirm the following draft articles on the development, deployment, and use of autonomous weapon systems"
        date: 2023-03-13
        url: https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2023)/CCW_GGE1_2023_WP.4_Rev1.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2023-wp4rev2-draftarticles
        claim: Australia is a named author of CCW/GGE.1/2023/WP.4/Rev.2, and affirms it in the form a treaty takes, as numbered draft articles.
        quote: "Affirm the following draft articles on the development, deployment, and use of autonomous weapon systems"
        date: 2023-05-15
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.1/2023/WP.4/Rev.2&l=en
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2025-wp7-draftarticles
        claim: Australia is a named author of CCW/GGE.1/2025/WP.7, and affirms it in the form a treaty takes, as numbered draft articles.
        quote: "Affirm the following draft articles on the development, deployment, and use of autonomous weapon systems"
        date: 2025-09-03
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.1/2025/WP.7&l=en
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2023-wp4rev1-draftarticles
        claim: The same articles ask for nothing new, specifying measures States are to implement to satisfy international humanitarian law as it already stands.
        quote: "which specify prohibitions and other regulatory measures for States to implement to effectively satisfy these IHL requirements in armed conflict"
        date: 2023-03-13
        url: https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2023)/CCW_GGE1_2023_WP.4_Rev1.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          This is the other side of the tension, and the reason the coding is
          AMBIG: the entry above shows a text written in the form of a treaty,
          and this one shows the same text asking only that existing law be
          implemented. The purpose clause is quoted whole rather than cut
          after "regulatory measures", because the truncated form reads as
          though the articles create prohibitions and would overstate the
          authors' position in the same way a cut excerpt of Draft Protocol VI
          would understate the ban camp's. The wording is carried unchanged
          through every revision of the series and is quoted once here, on the
          earliest text this state authored.


shift_events: []

flags:
