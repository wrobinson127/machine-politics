position_codings:
  - code: REG-SOFT
    confidence: EXPLICIT
    as_of: 2023-11-01
    approved: true    # analyst approval 2026-10-19, packet item 4
    scope_note: 'Türkiye asks for non-binding measures (a code of conduct, confidence-
      building measures, standards for responsible use) and says the expert group''s
      work should not lead to a legally binding instrument. It also says weapons
      not under meaningful human control conflict with existing IHL; that is a statement
      about current law, not a call for new prohibitions. In 2023 its objection
      to a binding text was tied to the lack of an agreed definition. In 2026 the
      objection carries no such condition.

      '
    rationale: 'In its 2023 explanation of vote, Türkiye asked for priority to a
      code of conduct and confidence-building measures, and said a binding text
      without an agreed definition would not serve its purpose. In 2025 it said
      it supports efforts to develop standards for responsible use of autonomous
      weapons systems. In September 2026, joining consensus on the expert group''s
      report, it said that work should not be a step toward a legally binding instrument,
      and that any outcome should be a framework rather than a source of new obligations.
      It abstained on all three UN resolutions.

      '
