    rationale: >
      In the 2025 First Committee general debate, the Democratic Republic of
      the Congo named autonomous weapons as a concern and urged states to
      negotiate a legally binding instrument so that military AI stays
      within international law. It did not say what the instrument should
      ban. The statement is in French only, so this reading is a
      description, not a quotation.
    evidence:
      - source: cod-c1-80-general-debate-2025
        claim: The DRC urges negotiation of a legally binding instrument covering military AI, in a passage about lethal autonomous weapons.
        description: >
          French-only general debate statement. After naming military AI and
          lethal autonomous weapons systems (SALA) as sources of concern, the
          DRC urges member states to act decisively to negotiate a legally
          binding instrument so that technological progress serves humanity
          and military AI stays compatible with international humanitarian
          law, adding that humans, not machines, must stay at the centre.
        date: 2025-10-16
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eightieth_session_(2025)/nwCGu-_PolwuT_nyc_fr.pdf
        lang: fr
        translation: none
        confidence: INFERRED
        kind: statement

