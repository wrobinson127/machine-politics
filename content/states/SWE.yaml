position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2024-05-15
    approved: true    # analyst approval 2026-10-19, packet item 7
    rationale: 'Sweden''s own words point two ways. In its 2024 submission it backs
      the two-tier approach: weapons that cannot be used lawfully should be expressly
      prohibited, and the rest regulated. That points toward a treaty with bans.
      The same submission says the form of regulation still needs thought, that
      what states can agree on remains to be seen, and that parallel processes and
      instruments without key states would not help. Sweden has never said, in a
      record opened here, that the instrument should be legally binding. In November
      2025 it joined a statement saying future negotiations must not prejudge the
      nature of their outcome. Sweden voted Yes on all three UN resolutions.

      '
