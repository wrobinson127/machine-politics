# India: GGE chair in 2017, consistent defender of the CCW consensus
# process, and the dataset's clearest vote trajectory (No, Abstain, Yes)
# in the opposite direction from the United States. Drafted 2026-07-17
# from research pass 5d. The 2024 explanation of vote was captured
# verbatim by the research pass from the mission's own archive; exact
# URL flagged. approved: false throughout.
iso3: IND
un_name: INDIA
display_name: India
coverage_tier: deep

position_codings:
  - code: CCW-ONLY
    confidence: EXPLICIT
    as_of: 2024-12-02
    approved: false
    rationale: >
      India holds that the CCW GGE is the appropriate forum and that the
      UNGA track duplicates it: its 2024 explanation of vote states it
      abstained because parallel mandates duplicate efforts and
      resources, while the GGE addresses the full range of challenges.
      The vote trajectory (No in 2023, Abstain in 2024, Yes in 2025) is
      a change in posture toward the UNGA resolutions; the research
      record shows no change in the underlying forum preference, so no
      position shift event is coded. Whether the 2025 Yes reflects
      substantive softening is an open question that the unretrieved
      2025 explanation of vote decides.
    evidence:
      - source: in-eov-79-62
        claim: India abstained on the 2024 resolution, stating its reason in its own explanation of vote.
        quote: "India has abstained on the resolution L.77"
        date: 2024-11-01
        url: https://pmindiaun.gov.in/
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          The research record dates this statement only "November 2024";
          the day is NOT established, so the first of the month stands in
          as a flagged placeholder until the primary is retrieved. The
          statement references L.77, the First Committee draft, so it
          predates the 2024-12-02 plenary vote.
      - source: in-eov-79-62
        claim: India objects to parallel UNGA mandates as duplicating the CCW GGE's work.
        quote: "amount to a duplication of efforts and resources"
        date: 2024-11-01
        url: https://pmindiaun.gov.in/
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          Contiguous fragment; the research capture elides the sentence's
          subject ("Parallel mandates..."), so only the verbatim fragment
          is quoted and the claim field carries the sense. Date is the
          flagged November stand-in; full EOV text retrieval is flagged.

