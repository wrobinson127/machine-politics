# India: GGE chair in 2017, consistent defender of the CCW consensus
# process, and the dataset's clearest vote trajectory (No, Abstain, Yes)
# in the opposite direction from the United States. Drafted 2026-07-17
# from research pass 5d. The 2024 explanation of vote was captured
# verbatim by the research pass from the mission's own archive; exact
# URL flagged. approved: false throughout.
iso3: IND
un_name: INDIA
display_name: India
coverage_tier: deep

position_codings:
  - code: CCW-ONLY
    confidence: EXPLICIT
    as_of: 2024-12-02
    approved: true   # analyst ruling 2026-07-17: CCW-ONLY, no shift; WP.3 supplement 2026-07-21
    scope_note: >
      India's stated two-tier: prohibit use of systems incapable of IHL
      compliance; regulate all others through national measures - expressed
      within its CCW-forum preference.
    rationale: >
      India holds that the Geneva convention's expert group is the right
      forum and that the UN General Assembly track duplicates it. In its
      2024 statement explaining its vote, India said it abstained because
      parallel processes duplicate effort while the Geneva group already
      covers the full range of issues. India's votes ran No, Abstain, Yes
      across the three resolutions. That is a change in how it treats the UN
      resolutions, not a change in which forum it wants, so no position
      shift is recorded. Whether the 2025 Yes signals a softer position is
      an open question; India's 2025 statement explaining that vote, not yet
      obtained, would answer it.
    evidence:
      - source: in-eov-79-62
        claim: India abstained on the 2024 resolution, stating its reason in its own explanation of vote.
        quote: "India has abstained on the resolution L.77"
        date: 2024-11-01
        date_precision: month   # the primary itself carries only "November 2024"; renders as "November 2024", never a day
        url: https://pmindiaun.gov.in/Cdgeneva/statement_content/NTA3
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          Verified against the primary 2026-08-24. The statement heads itself
          "November 2024" and carries no dateline, so the month is the
          precision the document itself supports; the day does not exist on
          the record. It references L.77, the First Committee draft, so it
          predates the 2024-12-02 plenary vote.
      - source: in-eov-79-62
        claim: India objects to parallel UNGA mandates as duplicating the CCW GGE's work.
        quote: "Parallel mandates and processes on lethal autonomous weapons systems also amount to a duplication of efforts and resources"
        date: 2024-11-01
        date_precision: month   # the primary itself carries only "November 2024"; renders as "November 2024", never a day
        url: https://pmindiaun.gov.in/Cdgeneva/statement_content/NTA3
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          Upgraded 2026-08-24 from a truncated fragment to the full sentence,
          now that the primary has been retrieved. The research capture had
          elided the subject ("Parallel mandates and processes..."), so the
          claim field had to carry sense the quote did not. India's next
          sentence names the consequence: it abstained on OP7 and OP9.
      # Supplement 2026-07-21: India's own 2025 working paper (CCW/GGE.1/2025/WP.3),
      # captured in-browser and read from the face; enriches the CCW-ONLY coding
      # with India's own-voice two-tier substance (does not displace it).
      - source: ccw-gge1-2025-wp3-india
        claim: In its own 2025 working paper India supports prohibiting the use of fully autonomous LAWS that cannot comply with IHL.
        quote: "India supports the prohibition of the use of fully autonomous LAWS which cannot be used in compliance with IHL"
        date: 2025-05-16
        url: https://undocs.org/en/CCW/GGE.1/2025/WP.3
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2025-wp3-india
        claim: For all other LAWS India calls for appropriate regulation of their use.
        quote: "For all other LAWS, the GGE should identify measures for appropriate regulations on their use"
        date: 2025-05-16
        url: https://undocs.org/en/CCW/GGE.1/2025/WP.3
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2025-wp3-india
        claim: India frames those regulations as implemented through national measures.
        quote: "Appropriate regulations arising out of any possible framework should be implemented nationally"
        date: 2025-05-16
        url: https://undocs.org/en/CCW/GGE.1/2025/WP.3
        lang: en
        translation: none
        confidence: EXPLICIT

