        date: 2026-08-31
        url: https://transcripts.un.org/en/asset/k17/k179utoxqf
        lang: en
        translation: none
        confidence: AMBIGUOUS
        note: 'UN automatic speech recognition transcript. The sentence goes on:
          "that is to consider and formulate by consensus instead of elements of
          an instrument without prejudging its nature" ("instead of" is the transcript''s
          rendering, likely "a set of").

          '
      - source: un-gge-2026-s2-m8-transcript
        kind: statement
        claim: Denmark welcomes that the draft report's recommendations are not
          binding treaty texts.
        quote: We appreciate that the recommendations in the draft report does not
          constitute binding treaty texts
        date: 2026-09-03
        url: https://transcripts.un.org/en/asset/k1j/k1jgb18wkv
        lang: en
        translation: none
        confidence: AMBIGUOUS
        note: 'UN automatic speech recognition transcript. The sentence continues
