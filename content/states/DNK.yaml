position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2024-03-04
    approved: true    # analyst approval 2026-10-19, packet item 9
    rationale: 'In March 2024 Denmark co-wrote, with six other states, a paper saying
      the future instrument should prohibit four classes of autonomous weapons and
      regulate the rest. The paper does not say whether that instrument should be
      binding. In its own words at the expert group, Denmark backed the text as
      a basis in line with a mandate that does not prejudge the instrument''s nature,
      and said it appreciated that the report''s recommendations are not binding
      treaty texts. It has not said, in any record opened here, that it wants a
      binding instrument. So the record shows prohibitions on one side and an open
      form on the other. Denmark voted Yes on all three UN resolutions.

      '
    evidence:
      - source: ccw-gge1-2024-wp3
        kind: working_paper
        claim: The 2024 paper co-written by Denmark says the future instrument should
          prohibit listed classes of LAWS.
        quote: 'The future instrument should prohibit the following weapons systems:'
        date: 2024-03-04
        url: https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2024)/CCW-GGE.1-2024-WP.3.pdf
        lang: en
        translation: none
        confidence: AMBIGUOUS
        note: 'Authors on the face: Bulgaria, Denmark, France, Germany, Italy, Luxembourg
          and Norway. The four classes: LAWS that are inherently indiscriminate,
          whose effects cannot be limited and controlled as IHL requires, that operate
          completely outside human control and a responsible chain of command, or
          that cause superfluous injury. The paper does not state the instrument''s
          nature. Its agenda heading repeats the mandate words "without prejudging
          its nature"; that is the group''s mandate, not the authors'' own position,
          and is not quoted as such. Not a draft treaty, so the authorship rule
          does not make this EXPLICIT.

          '
