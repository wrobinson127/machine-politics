    search_note: >
      Reviewed 2026-10-19: SG submissions: the UNODA Documents Library has no 78/241 file for Djibouti (of the sixteen East and Southern African states reviewed in this batch, only Malawi filed), no 79/239 file, and 79/62 set no new national-submission series; Djibouti is not among the posted statements of the May 2025 informal consultations under 79/62. CCW: not a speaker in the meetings.unoda.org statement listings for the GGE on LAWS 2023, 2024, 2025 and 2026 or the 2026 Review Conference PrepCom. First Committee: statements of 10 October 2023, 2024 (one French file listed for 16 and 24 October) and 16 and 23 October 2025 read; all in French. The 2023 statement names lethal autonomous weapons as a danger and recommends finding an international solution to counter their use, without naming any instrument; the 2024 statement says the militarisation of AI drives their proliferation; the 2025 statements are silent. Explanations of vote of 2 November 2023 and 5 and 8 November 2024 are listed with no posted text. Djibouti endorsed the US Political Declaration on military AI, which is context only. Ministry and mission websites were not reviewed.

