# Worked example: the explicit-statement case with a recorded vote arc.
# Drafted by tooling from verified primary sources. Nothing renders until
# the analyst of record sets approved: true.
iso3: USA
un_name: UNITED STATES
display_name: United States

position_codings:
  - code: REG-SOFT
    confidence: EXPLICIT
    as_of: 2023-02-16
    approved: false
    rationale: >
      The United States launched the non-binding Political Declaration on
      Responsible Military Use of Artificial Intelligence and Autonomy as its
      preferred new international measure, anchored in existing international
      humanitarian law.
    evidence:
      - source: us-political-declaration-2023
        claim: The US-led non-binding declaration anchors military AI use in existing international humanitarian law.
        quote: "use of AI in armed conflict must be in accord with States' obligations under international humanitarian law, including its fundamental principles"
        date: 2023-02-16
        url: https://lieber.westpoint.edu/political-declaration-responsible-military-use-artificial-intelligence-autonomy/
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          Verified against the Lieber Institute reproduction; state.gov served
          an error page to this project's tooling. The declaration launched
          2023-02-16 at REAIM; a revised version circulated October 2023.

  - code: CCW-ONLY
    confidence: EXPLICIT
    as_of: 2024-05-25
    approved: false
    rationale: >
      The United States' submission for the Secretary-General's report calls
      the CCW GGE uniquely suitable, opposes parallel initiatives, and states
      the time is not right to negotiate a legally binding instrument.
    evidence:
      - source: us-submission-78-241
        claim: The US identifies the CCW GGE as its preferred forum for international work on LAWS.
        quote: "The LAWS GGE is a uniquely suitable forum for international work on LAWS."
        date: 2024-05-25
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-submission-78-241
        claim: The US opposed initiatives outside the GGE.
        quote: "strongly opposed to any efforts to create parallel initiatives that would prejudge or seek to undermine the centrality of the LAWS GGE"
        date: 2024-05-25
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-submission-78-241
        claim: The US stated it did not support beginning negotiation of a legally binding instrument at that time.
        quote: "negotiations on a legally binding instrument on LAWS, we do not believe the time is right for such an endeavor"
        date: 2024-05-25
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-submission-78-241
        claim: The US position rests on existing international humanitarian law as the applicable framework.
        quote: "IHL already provides the applicable framework of prohibitions and regulations on the use of LAWS in armed conflict"
        date: 2024-05-25
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT

  - code: CCW-ONLY
    confidence: AMBIGUOUS
    as_of: 2025-12-01
    approved: false
    rationale: >
      The United States voted No on resolution 80/57 after stating in the
      First Committee that it did not support the text, and its 2025
      submission under resolution 79/239 opposes any new UN-based regulatory
      process. The 2025 record carries language close to the OPPOSE category.
      CCW-ONLY marks the best-supported reading; whether the record shows a
      reaffirmed CCW-ONLY or a move to OPPOSE is an open analyst question,
      and the confidence tier records that.
    evidence:
      - source: us-submission-79-239
        claim: By 2025 the US stated opposition to any new UN-based regulatory process for military AI and autonomy.
        quote: "the creation of a new regulatory process under UN auspices would be inappropriate and undermine efforts to strengthen international peace and security"
        date: 2025-03-31
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eightieth_session_(2025)/79-239-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-submission-79-239
        claim: The 2025 submission announces resistance to new restrictions on military AI capabilities.
        quote: "we will resist efforts to create restrictions that would stymie legitimate innovation"
        date: 2025-03-31
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eightieth_session_(2025)/79-239-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: un-c1-80-transcript-24
        claim: In its First Committee explanation of vote the US announced it did not support the LAWS resolution.
        quote: "The United States does not support L41 the law's resolution, and voted against it."
        date: 2025-11-04
        url: https://transcripts.un.org/en/ga/c1/80/24
        lang: en
        translation: none
        confidence: INFERRED
        note: >
          Verbatim from the UN automatic-speech-recognition transcript, which
          is not an official record; the ASR renders "L.41, the LAWS
          resolution" as quoted. The official text is the US Mission Geneva
          Cluster 4 statement, which blocks tool fetches (link on record).

shift_events:
  - state: USA
    date: 2024-05-25
    from: REG-SOFT
    to: CCW-ONLY
    approved: false
    rationale: >
      Between the 2023 declaration push and the 2024 submission, the stated
      preference narrowed from promoting new non-binding measures to defending
      the CCW GGE as the only appropriate track. The date marks the earliest
      verified record of the narrowed position, not necessarily the day the
      position changed.
    evidence:
      - source: us-submission-78-241
        claim: The submission opposes initiatives outside the GGE and declines negotiation of a binding instrument.
        quote: "strongly opposed to any efforts to create parallel initiatives that would prejudge or seek to undermine the centrality of the LAWS GGE"
        date: 2024-05-25
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT

doctrine:
  status: policy_identified
  approved: false
  entries:
    - title: "DoD Directive 3000.09, Autonomy in Weapon Systems"
      approved: false
      note: >
        Current version issued 2023-01-25; the original issued November 2012.
        The canonical PDF blocks tool fetches; quotes verified via official
        reproductions in the US submission to A/79/88 and the ICRC casebook.
      evidence:
        - source: dodd-3000-09
          claim: US doctrine requires design for appropriate levels of human judgment over the use of force.
          quote: "Autonomous and semi-autonomous weapon systems will be designed to allow commanders and operators to exercise appropriate levels of human judgment over the use of force."
          date: 2023-01-25
          url: https://www.esd.whs.mil/portals/54/documents/dd/issuances/dodd/300009p.pdf
          lang: en
          translation: none
          confidence: EXPLICIT
        - source: us-submission-78-241
          claim: Supersession history; the directive was issued November 2012 and updated January 2023.
          quote: "issuing DoD Directive 3000.09, titled Autonomy in Weapon Systems, in November 2012 and updating it in January 2023"
          date: 2024-05-25
          url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-US-EN.pdf
          lang: en
          translation: none
          confidence: EXPLICIT
  context:
    - note: >
        The Political Declaration on Responsible Military Use of AI and
        Autonomy (2023) is a diplomatic instrument, not national doctrine; it
        appears in the position record above and is listed here for
        orientation only.
