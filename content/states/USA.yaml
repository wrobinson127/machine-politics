position_codings:
  - code: REG-SOFT
    confidence: EXPLICIT
    as_of: 2023-02-16
    approved: true   # render-approved 2026-07-21 (the 2023 anchor of the ruled REG-SOFT -> CCW-ONLY recode)
    rationale: >
      The United States launched the non-binding Political Declaration on
      Responsible Military Use of Artificial Intelligence and Autonomy as its
      preferred new international measure, anchored in existing international
      humanitarian law.
    evidence:
      - source: us-political-declaration-2023
        claim: The US-led non-binding declaration anchors military AI use in existing international humanitarian law.
        quote: "use of AI in armed conflict must be in accord with States' obligations under international humanitarian law, including its fundamental principles"
        date: 2023-02-16
        url: https://lieber.westpoint.edu/political-declaration-responsible-military-use-artificial-intelligence-autonomy/
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          Verified against the Lieber Institute reproduction; state.gov served
          an error page to this project's tooling. The declaration launched
          2023-02-16 at REAIM; a revised version circulated October 2023.

  - code: CCW-ONLY
    confidence: EXPLICIT
    as_of: 2025-11-04
    approved: true    # ruled + render-approved 2026-07-21 (Reading B); archive snapshot of the source to follow (Walker, in-browser)
    scope_note: >
      Venue-exclusivity position: the United States supports the CCW GGE
      consensus track, including work toward a possible future instrument,
      and opposes the parallel UN General Assembly track (objecting
      specifically to preambular paragraph 7 and operative paragraph 3 of
      resolution 80/57). Not coded OPPOSE: the primary record does not state
      opposition to new instruments as such.
    rationale: >
      In its First Committee explanation of vote (US Mission to International
      Organizations in Geneva, 4 November 2025) the United States explained
      its No vote on the LAWS resolution (L.41) as a defense of the CCW
      consensus track: it strongly supports the CCW and the Group of
      Governmental Experts, encourages a consensus outcome in 2026, and
      objects to the parallel UNGA resolution specifically at preambular
      paragraph 7 and operative paragraph 3. The stated core is venue
      preference, not opposition to a new instrument as such - the statement
      expressly frames the CCW track as working "on a future instrument and
      other measures." This supersedes the earlier provisional OPPOSE coding
      (see flags: correction).
    evidence:
      # The EOV's decisive passages, quoted as contiguous verbatim excerpts
      # (<=25 words each per the evidence-quote rule); the full text is on file.
      - source: us-mission-cluster4-2025
        claim: In its explanation of vote the US did not support and voted against the LAWS resolution.
        quote: "the United States does not support L.41, the LAWS resolution, and voted against it"
        date: 2025-11-04
        url: https://geneva.usmission.gov/2025/11/04/80th-session-of-the-united-nations-general-assembly-first-committee-cluster-4-conventional-weapons/
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-mission-cluster4-2025
        claim: The US framed its No as support for the CCW track working toward a future instrument, not opposition to a new instrument.
        quote: "with a view to further deliberations and consensus among the CCW High Contracting Parties on a future instrument and other measures"
        date: 2025-11-04
        url: https://geneva.usmission.gov/2025/11/04/80th-session-of-the-united-nations-general-assembly-first-committee-cluster-4-conventional-weapons/
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-mission-cluster4-2025
        claim: The US objection to the UNGA resolution was specific to two paragraphs, not to a new instrument as such.
        quote: "the United States is deeply concerned about preambular paragraph 7 and operative paragraph 3"
        date: 2025-11-04
        url: https://geneva.usmission.gov/2025/11/04/80th-session-of-the-united-nations-general-assembly-first-committee-cluster-4-conventional-weapons/
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-mission-cluster4-2025
        claim: The US stated strong support for the CCW GGE on lethal autonomous weapons systems.
        quote: "this includes the ongoing work of the Group of Governmental Experts (GGE) on emerging technologies in the area of Lethal Autonomous Weapons Systems"
        date: 2025-11-04
        url: https://geneva.usmission.gov/2025/11/04/80th-session-of-the-united-nations-general-assembly-first-committee-cluster-4-conventional-weapons/
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: us-submission-79-239
        claim: The US objects to the parallel UN General Assembly regulatory track for military AI and autonomy.
        quote: "the creation of a new regulatory process under UN auspices would be inappropriate and undermine efforts to strengthen international peace and security"
        date: 2025-03-31
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eightieth_session_(2025)/79-239-US-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      # Corroboration 2026-07-21: the US September 2025 GGE paper (WP.6), captured
      # in-browser and read from the face; supports the CCW-track / existing-IHL reading.
      - source: ccw-gge1-2025-wp6-usa
        claim: The US frames autonomy as a weapon-system capability governed by existing IHL classifications.
        quote: "autonomy is a capability of the weapon system. This understanding means that LAWS fall under existing classifications in IHL"
        date: 2025-09-02
        url: https://undocs.org/en/CCW/GGE.1/2025/WP.6
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2025-wp6-usa
        claim: The US contemplates a future instrument or other measures within the CCW work.
        quote: "any future instrument or other possible measures will need a common understanding of what systems are covered to be effective"
        date: 2025-09-02
        url: https://undocs.org/en/CCW/GGE.1/2025/WP.6
        lang: en
        translation: none
        confidence: EXPLICIT

shift_events:
  - state: USA
    date: 2025-11-04
    from: REG-SOFT
    to: CCW-ONLY
    approved: true    # ruled + render-approved 2026-07-21 (Reading B)
    rationale: >
      The 2023 REG-SOFT position (promoting the non-binding Political
      Declaration as the preferred new measure) gave way, by 2025, to a
      venue-exclusivity stance. The United States voted No on the UNGA LAWS
      resolution 80/57 while explaining, in its First Committee explanation
      of vote, that it does so because it supports the CCW GGE consensus
      track "on a future instrument and other measures," objecting to the
      UNGA resolution at preambular paragraph 7 and operative paragraph 3.
      The date marks the explanation of vote (First Committee, 4 November
      2025); the plenary recorded its No on resolution 80/57 on 2 December
      2025. This shift supersedes the earlier provisional REG-SOFT -> OPPOSE
      event (see flags: correction).
    evidence:
      - source: us-mission-cluster4-2025
        claim: The US framed its No vote as support for the CCW track working toward a future instrument.
        quote: "with a view to further deliberations and consensus among the CCW High Contracting Parties on a future instrument and other measures"
        date: 2025-11-04
        url: https://geneva.usmission.gov/2025/11/04/80th-session-of-the-united-nations-general-assembly-first-committee-cluster-4-conventional-weapons/
        lang: en
        translation: none
        confidence: EXPLICIT

flags:
  - "RULED 2026-08-24, NO CHANGE: the US co-authored the draft-articles series (WP.4/Rev.1 and Rev.2 2023, WP.7 September 2025), and the question was whether that authorship bears on its coding. It does not, and this is the clearest case of the tie-break: the November 2025 explanation of vote is both later than the series and explicit in the state's own voice, so it governs outright, and it already points to CCW-ONLY. The series states no instrument preference on its face, which is why states whose only record it is code AMBIG. Per the rubric's tie_break_between_records, directness ranks before recency and an explicit record is not displaced by an inference from another document's silence."
  - "CORRECTION (2026-07-21, corrections policy): this state was initially coded OPPOSE at the PROVISIONAL tier (as_of 2025-12-02) from the UN ASR transcript of the vote and the 79-239 submission, with a countervailing-evidence note flagging that the primary explanation of vote was the decisive open item. On retrieval of that primary (US Mission to International Organizations in Geneva, First Committee Cluster 4, 4 Nov 2025), the analyst ruled Reading B (2026-07-21): the No vote is stated as a defense of the CCW consensus track, including work toward a possible future instrument, not opposition to new instruments as such. Coding corrected to CCW-ONLY at EXPLICIT; the PROVISIONAL tier retires. The superseded OPPOSE reading rested on the ASR 'does not support' line and the 79-239 'resist restrictions' line, both of which read on the primary as objections to the parallel UNGA track."
  - "RENDER-APPROVED 2026-07-21 (approved:true). One integrity follow-up remains: the analyst's in-browser web.archive.org snapshot of the mission-page EOV (robots-blocked to tooling; source us-mission-cluster4-2025) - invariant 11, a warning not a blocker, same status as the France/UK doctrine URLs."
  - "2023 REG-SOFT anchor is Political-Declaration-based; the 1 Nov 2023 US EOV on L.56 (ADR-cited: 'the time is not right to begin negotiating a legally binding instrument') would upgrade the anchor from declaration-based to EOV-based - nice-to-have retrieval."
  - "VOTES-LAYER ANNOTATION (nice-to-have): L.41 moved committee 156-5-8 (6 Nov 2025) to plenary 164-6-7 (2 Dec 2025) - one more No, one fewer abstention between committee and plenary. Plenary 80/57 No bloc: Belarus, Burundi, DPRK, Israel, Russian Federation, United States (corroborates the reconciled CSV, which stays authoritative)."

