doctrine:
  status: policy_identified
  approved: false
  entries:
    - title: "DoD Directive 3000.09, Autonomy in Weapon Systems"
      approved: false
      note: >
        Current version issued 2023-01-25; the original issued November 2012.
        The canonical PDF blocks tool fetches; quotes verified via official
        reproductions in the US submission to A/79/88 and the ICRC casebook.
      evidence:
        - source: dodd-3000-09
          claim: US doctrine requires design for appropriate levels of human judgment over the use of force.
          quote: "Autonomous and semi-autonomous weapon systems will be designed to allow commanders and operators to exercise appropriate levels of human judgment over the use of force."
          date: 2023-01-25
          url: https://www.esd.whs.mil/portals/54/documents/dd/issuances/dodd/300009p.pdf
          lang: en
          translation: none
          confidence: EXPLICIT
        - source: us-submission-78-241
          claim: Supersession history; the directive was issued November 2012 and updated January 2023.
          quote: "issuing DoD Directive 3000.09, titled Autonomy in Weapon Systems, in November 2012 and updating it in January 2023"
          date: 2024-05-25
          url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-US-EN.pdf
          lang: en
          translation: none
          confidence: EXPLICIT
  context:
    - note: >
        The Political Declaration on Responsible Military Use of AI and
        Autonomy (2023) is a diplomatic instrument, not national doctrine; it
        appears in the position record above and is listed here for
        orientation only.
