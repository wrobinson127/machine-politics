# El Salvador: co-author of Draft Protocol VI (CCW/GGE.1/2022/WP.8), the
# Latin-American-led draft treaty that prohibits autonomous weapons on two
# cumulative conditions and regulates the rest (a two-tier instrument, not a
# blanket ban; excerpt scope verified against the document face 2026-08-24). Coded from draft-instrument authorship (statement-
# class evidence, per the 2026-07-21 rule amendment). Nothing renders until the
# analyst of record sets approved: true.
iso3: SLV
un_name: EL SALVADOR
display_name: El Salvador

position_codings:
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2021-09-27
    approved: true
    scope_note: >
      Coded from co-authorship of a substantive draft instrument (Draft
      Protocol VI) - a state speaking in the strongest written form. Under the
      2026-07-21 rule, authorship of a draft treaty text is statement-class
      evidence for each named author, distinct from mere co-sponsorship.
      Stated openly, because it is a judgment call a reader may weigh
      differently: this coding rests on the state being a named author of
      the text, not on a separate statement in its own voice. What it rests
      on is shown in full - the article, the document symbol, the date, and
      the author list from the face - so a reader who thinks authorship
      should count for less can discount it directly. The rule is applied
      symmetrically to drafts that prohibit and drafts that do not. The reading
      is dated from September 2021, when the state co-wrote a
      working paper asking for a mandate to negotiate a legally
      binding instrument and saying fully autonomous weapons must be
      prohibited. That paper states an instrument preference, so it
      counts as the state's own position.
    rationale: >
      El Salvador first set out this position in September 2021, as
      a co-author of a working paper that asked the Geneva weapons
      convention to negotiate a legally binding instrument and said
      fully autonomous weapons must be prohibited.
      El Salvador co-wrote Draft Protocol VI in August 2022, a proposed
      treaty for the Geneva weapons convention. It would ban autonomous
      weapons that attack without meaningful human control and cannot comply
      with the laws of war, and regulate the rest. Putting its name on a
      draft treaty is the most direct position a state can take.
    evidence:
      - source: ccw-gge1-2021-wp7-group
        claim: El Salvador co-authored a 2021 paper asking for a mandate to negotiate a legally binding instrument.
        quote: "Recommend a new mandate for the GGE to initiate immediately an open-ended process to negotiate a legally binding instrument."
        date: 2021-09-27
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.1/2021/WP.7&l=E
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: working_paper
        note: Ten authors on the face of CCW/GGE.1/2021/WP.7, verified 2026-10-19. Counts under ruling R2 because it states an instrument preference.
      - source: ccw-gge1-2021-wp7-group
        claim: The same paper says fully autonomous systems must be prohibited.
        quote: "weapon systems or configurations within the scope of our discussions that are fully autonomous are unacceptable and must be prohibited under international law."
        date: 2021-09-27
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.1/2021/WP.7&l=E
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: working_paper
        note: Paragraph 9(a); the sentence opens "Real or hypothetical".
      - source: ccw-gge1-2022-wp8-draftprotocol
        claim: El Salvador co-authored a draft CCW protocol whose prohibition on autonomous weapons is conditional, and is paired with regulation of the rest.
        quote: "It is prohibited to develop, produce, possess, acquire, deploy, transfer, or use under any circumstances autonomous weapons systems if:"
        date: 2022-08-09
        url: https://undocs.org/en/CCW/GGE.1/2022/WP.8
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2022-wp8-draftprotocol
        claim: The prohibition is conditional, and its first condition is that the system's autonomous functions are designed to attack outside meaningful human control.
        quote: "its autonomous functions are designed to be used to conduct attacks outside meaningful human control"
        date: 2022-08-09
        url: https://undocs.org/en/CCW/GGE.1/2022/WP.8
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          Article 3 Sec 1 prohibits conditionally. This is the first of two
          conditions, joined in the text by "and", so both must hold for the
          prohibition to bite; the second is that the system's use does not
          comply with international humanitarian law or the dictates of
          public conscience. Quoted as a separate entry because the verb
          list and the condition together exceed the 25-word quote limit.
          Verified against the face of the document 2026-08-24.
      - source: ccw-gge1-2022-wp8-draftprotocol
        claim: The draft protocol pairs the prohibition with a meaningful-human-control regulation across the life cycle.
        quote: "Each High Contracting Party shall institute measures to ensure that meaningful human control is retained in the entire life cycle"
        date: 2022-08-09
        url: https://undocs.org/en/CCW/GGE.1/2022/WP.8
        lang: en
        translation: none
        confidence: EXPLICIT

shift_events: []

