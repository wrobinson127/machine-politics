flags:
  - "ANALYST RULING 2026-08-24: AMBIG, on the ground that the draft-articles text supports a treaty-shaped reading (they wrote articles) and a process-shaped reading (they filed inside the CCW and asked for nothing new) and refuses to choose between them. Both CCW-ONLY and LBI-OPEN were rejected as readings of the same silence in opposite directions. A face search returning zero occurrences of legally binding, binding instrument, negotiation and forum is a finding about the document, not a gap in retrieval: these states deliberately did not specify. Drafted first as CCW-ONLY at EXPLICIT, corrected to INFERRED in adversarial review, then ruled to AMBIG. Same shape as the China coding, and correct for the same reason"
  - "RESOLVES ON RETRIEVAL: this state's own statements are what would settle the reading. Until they are retrieved the coding stays AMBIG. The coverage asymmetry against the ban camp is real and is the honest cost of not guessing"
