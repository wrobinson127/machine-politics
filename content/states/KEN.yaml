  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2025-10-13
    approved: false
    rationale: >
      At the UN First Committee in October 2025, Kenya urged states to
      negotiate a legally binding instrument with clear prohibitions and
      robust regulations on autonomous weapons. A year earlier it had called
      for a robust international regulatory framework. On this site's scale
      that is a treaty with bans.
