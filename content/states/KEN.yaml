      - source: ken-c1-80-general-debate-2025
        claim: Kenya calls for negotiating a legally binding instrument containing prohibitions and regulations.
        quote: "Kenya urges the international community to move decisively towards the negotiation of a legally binding instrument with clear prohibitions and robust regulations"
        date: 2025-10-13
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eightieth_session_(2025)/Statement_Kenya_English.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: statement
      - source: ken-c1-79-general-debate-2024
        claim: In 2024 Kenya called for a robust international regulatory framework for LAWS, without saying it must be binding.
        quote: "We must act quickly to establish a robust international regulatory framework"
        date: 2024-10-14
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/Statement_by_Kenya_UNGA79_1C.pdf
        lang: en
