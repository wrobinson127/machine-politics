flags:
  - "The 2025 statement's face is dated 13 October 2025; the UNODA listing shows 14 October 2025. as_of uses the face date."
  - "The brief said Kenya has spoken at the CCW. I could not find any Kenyan CCW statement: Kenya appears in none of the meetings.unoda.org statement listings for the GGE on LAWS 2023 to 2026 or the 2026 PrepCom, nor in the eight 2025 to 2026 GGE and PrepCom machine transcripts I checked. Secondary sources say Kenya is not a CCW High Contracting Party. If the analyst knows of a Kenyan CCW statement, it is the retrieval target."
  - "The 2024 wording ('robust international regulatory framework') does not say binding. I did not treat 2024 to 2025 as a shift, because 2024 states no instrument type; the analyst could alternatively date an LBI-BAN reading only from 2025 and leave 2024 as context, which is what this draft does."
  - "The 2026 general debate statement (9 October 2026, labelled DRAFT STATEMENT on its face) only says emerging technologies must not diminish meaningful human control; no retreat from the 2025 call, no new instrument language."
  - "Kenya endorsed REAIM 2026 Pathways to Action (content/endorsements.yaml). Context only."
  - "The 10 October 2023 First Committee statement is listed on meetings.unoda.org with no posted text; the 24 October 2023 cyber statement mentions only misuse of AI."
