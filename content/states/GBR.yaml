# United Kingdom: the deepest AI-in-defence governance stack outside the
# US, coded from its own published position paper. Drafted 2026-07-17
# from research pass 5a; quotes verified verbatim against the primary PDF
# by tooling this pass. approved: false throughout.
iso3: GBR
un_name: UNITED KINGDOM
display_name: United Kingdom
coverage_tier: deep

position_codings:
  - code: REG-SOFT
    confidence: EXPLICIT
    as_of: 2022-06-14
    approved: true   # analyst ruling 2026-07-17
    rationale: >
      The UK's published policy "Ambitious, Safe, Responsible" (2022) says
      the UK does not have and will not build fully autonomous weapons, and
      opposes any system without meaningful human involvement. But it
      pursues non-binding rules rather than a treaty: the UK signed the US
      Political Declaration and the REAIM pledges, voted Yes on all three UN
      resolutions, and did not join the September 2025 statement in which
      France and Germany said they were ready to negotiate a treaty. The
      position has held across a change of government, and the "no
      intention" wording goes back to 2013.
    evidence:
      - source: uk-asr-2022
        claim: The UK renounces possession and development of fully autonomous weapon systems.
        quote: "the United Kingdom does not possess fully autonomous weapon systems and has no intention of developing them"
        date: 2022-06-14
        url: https://assets.publishing.service.gov.uk/media/62a9b1d1e90e07039e31b8cb/20220614-Ambitious_Safe_and_Responsible.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: uk-asr-2022
        claim: The UK opposes systems operating without meaningful human involvement across their lifecycle.
        quote: "the creation and use of systems that would operate without meaningful and context-appropriate human involvement throughout their lifecycle"
        date: 2022-06-14
        url: https://assets.publishing.service.gov.uk/media/62a9b1d1e90e07039e31b8cb/20220614-Ambitious_Safe_and_Responsible.pdf
        lang: en
        translation: none
        confidence: EXPLICIT

shift_events: []

doctrine:
  status: policy_identified
  approved: true   # analyst ruling 2026-07-17
  entries:
    - title: "Ambitious, Safe, Responsible: our approach to the delivery of AI-enabled capability in Defence"
      approved: true   # analyst ruling 2026-07-17: ASR is core
      url: https://assets.publishing.service.gov.uk/media/62a9b1d1e90e07039e31b8cb/20220614-Ambitious_Safe_and_Responsible.pdf
      note: >
        The UK's stated position on autonomous weapons and its ethical
        principles for military AI, published June 2022. This is the closest
        UK equivalent to the US directive. It is both the UK's military
        policy and the published position paper behind the reading above. It
        survived the 2024 change of government; the new government's own
        implementation documents build on it.
      evidence:
        - source: uk-asr-2022
          claim: The policy paper states the UK position on autonomy in weapon systems.
          quote: "the United Kingdom does not possess fully autonomous weapon systems and has no intention of developing them"
          date: 2022-06-14
          url: https://assets.publishing.service.gov.uk/media/62a9b1d1e90e07039e31b8cb/20220614-Ambitious_Safe_and_Responsible.pdf
          lang: en
          translation: none
          confidence: EXPLICIT
  context:
    - note: >
        Defence AI Strategy (June 2022): the wider strategy the ASR policy
        accompanies. URL to pin at curation.
    - note: >
        House of Lords AI in Weapon Systems Committee, "Proceed with
        Caution" (2023-12-01, HL Paper 16, 36 recommendations), answered
        by the Government Response (CP 1023, February 2024). The
        government declined the committee's recommendation to adopt an
        operational definition of autonomous weapon systems; the response
        is the citable primary for that fact. URLs to pin at curation.
    - note: >
        JSP 936 Part 1, "Dependable AI in Defence" (November 2024):
        directive- class but AI-wide rather than weapons-autonomy-specific.
    - note: >
        JDP 0-30, UK Air Power (September 2022 edition): carries operative
        UK autonomy definitions. Definitional apparatus entry; URL to pin.

