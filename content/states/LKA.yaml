position_codings:
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2023-03-06
    approved: true    # analyst approval 2026-10-19, bulk review
    rationale: >
      Sri Lanka told the Geneva expert group in March 2023 that a new treaty
      with prohibitions and regulations is needed. Its 2024 submission to the
      UN Secretary-General asks for negotiations on a legally binding
      instrument that bans some autonomous weapons and strictly regulates the
      rest, and it said the same in Geneva in 2026. On this site's scale, that
      is a treaty with bans.
    evidence:
      - source: lka-gge-2023-03-06
        claim: Sri Lanka says a new treaty setting out prohibitions and regulations is necessary.
        quote: "a new international treaty stipulating the prohibitions and regulations on positive obligations is necessary for legal clarity, certainty and compliance"
        date: 2023-03-06
        url: https://live.lankamission.org/images/PDF-2023/6_march_2023_GGE_LAWS_Statement.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: statement
      - source: unsg-report-a-79-88
        claim: Sri Lanka's submission supports negotiating a legally binding instrument.
        quote: "Sri Lanka strongly supports and advocates the negotiation of a legally binding instrument on autonomous weapons systems"
        date: 2024-05-25
        url: https://docs.un.org/en/A/79/88
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
        note: Sri Lanka's reply as reproduced in A/79/88, Annex I (pages 103 to 106), dated 25 May 2024. No separate national file was found on the UNODA library under the usual file name.
      - source: unsg-report-a-79-88
        claim: The same submission says the instrument should prohibit some systems and strictly regulate others.
        quote: "should entail the prohibition of certain autonomous weapons systems that cannot be in compliance with international humanitarian law and the strict regulation of others"
        date: 2024-05-25
        url: https://docs.un.org/en/A/79/88
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
      - source: lka-gge-2026-03
        claim: In 2026 Sri Lanka still wants negotiations on a binding instrument that prohibits autonomous weapons.
        quote: "future negotiation of a legally binding instrument to prohibit lethal autonomous weapons systems"
        date: 2026-03-02
        url: https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2026)/Statement_by_Sri_Lanka_-_Box_1_&_3_-__2026_1st_Session_on_GGE_on_LAWS_-_02-06_March_2026.pdf
        lang: en
