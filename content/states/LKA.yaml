flags:
  - "The 2023 mission PDF repeats several paragraphs in slightly different wording, as if two drafts were merged. The quoted sentence appears in both versions. It does not name Sri Lanka in the body; attribution rests on it being posted by Sri Lanka's Geneva mission. If the analyst prefers a UNODA-hosted first item, the 4 March 2024 GGE statement (UNODA) says 'Prohibition' of LAWS is the ultimate expectation and asks for 'Prohibition and Regulation'."
  - "Further consistent primaries opened: First Committee 79th session cluster 5 (25 Oct 2024, docs-library Seventy-Ninth_session_(2024)/Sri_Lanka_0.pdf, 'begin negotiations on an international legally binding instrument on LAWS'), 80th session cluster 5 (27 Oct 2025), 81st session general debate (Oct 2026), and GGE interventions of 31 Aug to 3 Sep 2026 calling for an unconditional ban on anti-personnel autonomous weapons."
  - "Sri Lanka also associated itself with the Vienna 2024 chair's summary (A/79/88) and the 2021 70-state joint statement; endorsements, context only."
  - "Sri Lanka's call likely predates 2023; as_of is the earliest document opened."
