    rationale: >
      At the UN First Committee in October 2025, Montenegro restated firm
      support for the Geneva weapons convention, the CCW, and praised the work
      of its expert group on lethal autonomous weapons. It did not say what
      that work should produce. On this site's scale that is support for the
      Geneva process with the outcome left unstated.
