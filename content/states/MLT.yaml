position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2024-10-09
    approved: false
    rationale: >
      At the UN First Committee in 2024 and 2025, Malta said autonomous weapons
      that cannot comply with the laws of war should be banned and that human
      control must be kept. It has not said what kind of instrument should do
      the banning, or whether it should be binding. So its words point toward
      prohibitions while leaving the form open.
    evidence:
      - source: mlt-c1-79-general-2024
        claim: Malta says autonomous weapons that cannot comply with IHL should be banned.
        quote: "LAWS that would not comply with international humanitarian law should be banned."
        date: 2024-10-09
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/Statement_by_Malta.pdf
        lang: en
        translation: none
        confidence: AMBIGUOUS
        kind: statement
        note: >
          The statement text is undated; 2024-10-09 is the date the UNODA
          meetings portal shows for it. The preceding sentence: "human control
          must be retained over autonomous weapons systems".
      - source: mlt-c1-80-general-2025
        claim: Malta repeats its call to prohibit fully autonomous weapons that do not comply with IHL.
        quote: "has advocated for the prohibition of fully autonomous weapons, which are not in compliance with IHL"
        date: 2025-10-15
