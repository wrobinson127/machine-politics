flags:
  - "Weighing: Malta calls for a ban but names no instrument and no legal form. That matches the DNK pattern (prohibitions plus open form), so AMBIG. A ban is hard to picture without a binding rule, which argues for LBI-BAN at INFERRED; the brief says not to fill the form gap, so it is held at AMBIG. Analyst call."
  - "2023 general debate (78th session, Malta_0.pdf) only says LAWS must comply with international law, in particular IHL."
