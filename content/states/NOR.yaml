position_codings:
  - code: LBI-OPEN
    confidence: EXPLICIT
    as_of: 2024-08-26
    approved: true   # analyst ruling 2026-07-17
    rationale: >
      Norway says plainly that it supports a treaty to clarify how the laws
      of war apply to autonomous weapons, backs the two-tier approach, and
      co-wrote the seven-state paper with Bulgaria, Denmark, France,
      Germany, Italy, and Luxembourg. It is read as "terms open" rather than
      "with bans" because its own words support a treaty to clarify the law,
      without framing it around a ban. The reading follows what Norway said.
    evidence:
      - source: no-gge-statement-2024
        claim: Norway supports a legally binding instrument clarifying IHL application to autonomous weapons.
        quote: "Norway supports the development of a legally binding instrument in order to clarify the application of international humanitarian law to autonomous weapons systems"
        date: 2024-08-26
        url: https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2024)/2024-08-26_Norway_CCW_GGE_LAWS_2nd_session_general_statement.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
  # HELD 2026-10-19 (packet item 11): candidate reading kept unapproved. Its shift is not drafted: ruling R1 bars a shift resting on transcripts alone.
  - code: LBI-BAN
    confidence: PROVISIONAL
    as_of: 2026-09-08
    approved: false
    scope_note: 'Two-tier. Norway asks for a negotiating mandate open to prohibitions,
      regulations and guidelines, with a legally binding instrument as an aim. Not
      a blanket ban.

      '
    rationale: 'At the September 2026 preparatory meeting Norway asked the Review
      Conference to set up negotiations on an instrument. It said the mandate should
      cover prohibitions, regulations and guidelines, and that a legally binding
      instrument should be an aim. In the March 2026 expert group it backed the
      words "it is prohibited" to keep the two-tier structure. That is a treaty
      with some bans, which the rubric reads as LBI-BAN. The 2024 reading was terms
      open. The tier is provisional because the record is a machine transcript;
      Norway''s written statement has not been found.

      '
