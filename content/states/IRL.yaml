# Ireland: drafted 2026-10-19 for the analyst of record. approved: false throughout.
iso3: IRL
un_name: IRELAND
display_name: Ireland
coverage_tier: anchor

position_codings:
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2024-05-24
    approved: false
    rationale: >
      In its May 2024 submission to the UN Secretary-General, Ireland said it
      supports legally binding rules and a two-tier approach: ban some
      autonomous weapons outright and regulate all the others. In October 2025
      it told the First Committee it wants urgent progress on a legally binding
      instrument. On this site's scale that is a treaty with bans.
    evidence:
      - source: irl-submission-78-241
        claim: Ireland supports legally binding rules on autonomous weapons.
        quote: "Ireland supports calls for legally-binding rules, and guidelines to address AWS"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Ireland-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
      - source: irl-submission-78-241
        claim: Ireland backs the two-tier approach, with some systems banned outright and the rest regulated.
        quote: "certain AWS must be prohibited outright, with all other AWS subject to multilaterally agreed regulation."
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Ireland-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: submission
        note: >
          The sentence opens "Ireland supports the 'two-tier approach' developed in
          the GGE on LAWS, whereby". The submission then lists three grounds for
          prohibition: systems that cannot comply with IHL, that are not
          sufficiently predictable or controllable, or that engage targets without
          the necessary human control.
      - source: irl-c1-80-conventional-2025
        claim: Ireland restates its call for a legally binding instrument in 2025.
        quote: "Ireland calls for urgent progress on a legally binding instrument on autonomous weapons systems."
        date: 2025-10-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eightieth_session_(2025)/Statement_by_Ireland.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: statement

