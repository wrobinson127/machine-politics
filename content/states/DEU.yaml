# PDF by tooling this pass. approved: false throughout.
iso3: DEU
un_name: GERMANY
display_name: Germany
coverage_tier: deep

position_codings:
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2024-05-24
    approved: true   # analyst ruling 2026-07-17
    scope_note: >
      Two-tier, aligned with France: prohibition of systems operating
      outside human control, regulation of the rest. Category-scoped,
      not a blanket ban.
    rationale: >
      Germany's submission to the UN Secretary-General supports a treaty in
      the Geneva convention that bans autonomous weapons that cannot comply
      with the laws of war, and separately supports a new protocol banning
      weapons that operate outside human control, with regulation for the
      rest. It states in its own words that the decision over life and death
      must be made by humans.
    evidence:
      - source: de-submission-78-241
        claim: Germany supports a CCW additional protocol prohibiting LAWS outside human control.
        quote: "Germany supports the creation of an additional protocol to the CCW that entails the prohibition of LAWS operating outside of human control"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Germany-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: de-submission-78-241
        claim: The human-decision principle grounds the German position.
        quote: "The decision over life and death must be made by humans."
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-Germany-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT

