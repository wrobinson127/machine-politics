position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2024-10-15
    approved: true    # analyst approval 2026-10-19, bulk review
    rationale: >
      Brunei's own words point two ways. In the UN First Committee's
      2024 general debate it said autonomous weapons should not operate
      without strict regulation and oversight, and it took note of the
      Secretary-General's call for a legally binding instrument to
      prohibit them by 2026. It did not say it wants that treaty, or
      what kind of rules it prefers.
    evidence:
      - source: brn-c1-79-general-debate-2024
        claim: Brunei points to the Secretary-General's call for a binding instrument to prohibit LAWS by 2026.
        quote: "Brunei Darussalam takes note of the recommendation made by the Secretary-General in 2023 to develop a legally binding instrument to prohibit LAWS by 2026"
        date: 2024-10-15
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/Brunei_Darussalam.pdf
        lang: en
        translation: none
        confidence: INFERRED
        kind: statement
      - source: brn-c1-79-general-debate-2024
        claim: Brunei warns against LAWS operating without strict regulatory frameworks.
        quote: "We have much more to lose than we stand to gain if we allow LAWS to operate without strict regulatory frameworks and oversight"
        date: 2024-10-15
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/Brunei_Darussalam.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        kind: statement

