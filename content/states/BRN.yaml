flags:
  - "Audit correction 2026-10-19: was LBI-BAN INFERRED. 'Takes note' is not support, and a clause about urging other states had no evidence behind it."
  - "'Takes note' is weaker than 'supports'. The sentence goes on: 'and further calls upon other member states to solidify global efforts', which reads as endorsement, hence LBI-BAN at INFERRED. Alternatives: LBI-OPEN at INFERRED, or NONE if the analyst treats 'takes note' as neutral."
  - "Statement date: header gives only the debate period (7 to 16 October 2024); 2024-10-15 is the UNODA Meetings Place posting date."
  - "Later statements are softer: 2025 general debate calls for 'human oversight and responsible governance' of AI, including misuse in autonomous weapons; 2026 general debate speaks only of responsible AI use under international law. Neither contradicts the 2024 reading. 2023 general debate (posted 2023-10-09) was not retrieved as a file."
  - "No submission under 78/241 (not in A/79/88; 78-241-Brunei-EN.pdf returns 403). Brunei is absent from the 2023 to 2026 GGE statement lists on UNODA Meetings Place."
