position_codings:
  - code: LBI-BAN
    confidence: EXPLICIT
    as_of: 2024-05-24
    approved: true   # analyst ruling 2026-07-17
    scope_note: >
      Category-scoped: France supports a binding instrument that prohibits
      fully autonomous systems (SALA) while regulating partially autonomous
      ones. Not a blanket-ban position.
    rationale: >
      France's submission for the Secretary-General's report states its
      preferred outcome plainly: a future instrument, possibly an
      Additional Protocol to the CCW, structured on a two-tier approach
      that prohibits fully autonomous systems and regulates partially
      autonomous ones. The prohibition is category-scoped (fully
      autonomous only), which this coding's scope note carries so France
      is not misread as supporting a blanket ban.
    evidence:
      # Primary quote (swap RULED 2026-07-19): the direct statement of the
      # preferred outcome, promoted from the returns capture.
      - source: fr-submission-78-241
        claim: France states in its UN submission that it supports negotiating and adopting a new CCW Additional Protocol on LAWS.
        quote: "France supports the negotiation and adoption of an Additional Protocol to the CCW"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-France-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: fr-submission-78-241
        claim: France's preferred instrument follows a two-tier prohibit-and-regulate structure.
        quote: "structuring this future instrument — which could take the form of an Additional Protocol to the CCW"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-France-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: fr-submission-78-241
        claim: The instrument France describes follows the two-tier prohibit-and-regulate structure.
        quote: "according to a two-tier approach"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-France-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: fr-submission-78-241
        claim: France attached its own draft instrument as an annex to the submission.
        quote: "Detailed proposal for such an instrument can be found in Annex of the present submission"
        date: 2024-05-24
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Ninth_session_(2024)/78-241-France-EN.pdf
        lang: en
        translation: none
        confidence: EXPLICIT

