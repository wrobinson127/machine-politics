doctrine:
  status: policy_identified
  approved: false   # returns 2026-07-19; Walker approves per entry
  entries:
    - title: "Avis sur l'intégration de l'autonomie dans les systèmes d'armes létaux (Defence Ethics Committee opinion on autonomy in lethal weapon systems)"
      approved: false
      url: https://www.defense.gouv.fr/comite-dethique-defense
      note: >
        Opinion of the Comité d'éthique de la défense (Ministère des
        Armées), 29 April 2021; the committee was seized by the Minister on
        10 January 2020. An OFFICIAL ENGLISH version is published on the
        committee page, so quotes from this document are official-translation
        tier. Research pass 5b and returns 2026-07-19 report it holds fully
        autonomous lethal systems (SALA) unacceptable and partially
        autonomous systems acceptable under five conditions; those two
        passages (the SALA renunciation and the five conditions) are NOT yet
        captured verbatim from the official English PDF and must be before
        the doctrinal conclusion renders. The evidence below establishes only
        the opinion's existence, subject and date. Core-vs-context: formally
        an advisory opinion, but the Ministry later cites it (parliamentary
        answer QE 8402, 2025) as the standing national reference framework.
        RULED CORE 2026-07-19: core = the opinion plus the government's
        adopting and citing statements. The entry stays approved:false only
        because its doctrinal conclusion (SALA renunciation + five
        conditions) is not yet captured verbatim; it approves the moment the
        official English passages land.
      evidence:
        - source: fr-comedef-avis-2021
          claim: France's Defence Ethics Committee was seized by the Minister of the Armed Forces and issued an opinion specifically on lethal autonomous weapon systems, dated 29 April 2021.
          quote: "une demande d'avis sur les « systèmes d'armes létaux autonomes »"
          date: 2021-04-29
          url: https://www.defense.gouv.fr/comite-dethique-defense
          lang: fr
          translation: official
          confidence: EXPLICIT
          note: >
            Verbatim contiguous fragment from the French PDF face (returns
            2026-07-19). Establishes the opinion's subject and existence
            only; an official English version exists (translation: official).
            The SALA-renunciation and five-conditions passages are pending
            verbatim capture from that official English PDF.
  context:
    - note: >
        Government adoption (returns 2026-07-19): a Ministry for Europe and
        Foreign Affairs answer to written question QE 8402 (2025) cites the
        2021 Defence Ethics opinion as the standing national reference
        framework and states France continues to contribute actively at the
        GGE. Verbatim quote to capture from the Journal Officiel record; it
        feeds the core-vs-context ruling. Source questions.assemblee-nationale.fr.
    - note: >
        President Macron, WIRED interview (about 31 March 2018): stated he is
        "categorically opposed" to lethal autonomous weapons to the extent
        they would "abolish all accountability". Context-class head-of-state
        remark; source fr-macron-wired-2018, to be archived.
    - note: >
        Defence Minister Florence Parly (May 2021): "France says and will
        always say no to killer robots." Context and era texture; original
        speech URL to pin.
    - note: >
        2013 origin (honest, downgraded per returns 2026-07-19): the CCW
        agreed its first LAWS mandate at the November 2013 Meeting of High
        Contracting Parties, and France's Ambassador Jean-Hugues
        Simon-Michel chaired the process and led the 2014 Informal Meeting of
        Experts (source fr-ccw-ime-2014; UN Chronicle for the chairing role).
        The stronger "France initiated the debate" framing is not directly
        documented and is not asserted.

