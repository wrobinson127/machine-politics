doctrine:
  status: policy_identified
  approved: true    # analyst confirms integration 2026-07-19 (official English landed)
  entries:
    - title: "Avis sur l'intégration de l'autonomie dans les systèmes d'armes létaux (Defence Ethics Committee opinion on autonomy in lethal weapon systems)"
      approved: true
      url: http://www.defense.gouv.fr/sites/default/files/ministere-armees/20210429_Comit%C3%A9%20d%27%C3%A9thique%20de%20la%20d%C3%A9fense%20-%20Avis%20int%C3%A9gration%20autonomie%20syst%C3%A8mes%20armes%20l%C3%A9taux%20-%20Version%20anglaise.pdf.pdf
      note: >
        Opinion of the Comité d'éthique de la défense (Ministère des Armées),
        dated 29 April 2021 on its face; the committee was seized by the
        Minister on 10 January 2020. Quotes below are from the Ministry's
        OFFICIAL ENGLISH version (translation: official). RULED CORE
        2026-07-19: core = the opinion plus the government's adopting and
        citing statements (a 2025 parliamentary answer, QE 8402, cites it as
        the standing national reference framework). Formally an advisory
        opinion; in practice the government's standing framework. The
        opinion's own architecture is six guiding principles and 25
        guidelines; it extends the refusal beyond use to manufacturing and
        export (P3), and traces the renunciation to the 5 April 2019 Saclay
        declaration (footnote 10). The URL carries a double .pdf extension in
        the ministry's own href; that is intentional, not a typo.
      evidence:
        - source: fr-comedef-avis-2021
          claim: The French government has renounced the use of lethal autonomous weapon systems, and the Defence Ethics Committee endorsed that decision.
          quote: "The French government has declared that it renounces the use of LAWS."
          date: 2021-04-29
          url: http://www.defense.gouv.fr/sites/default/files/ministere-armees/20210429_Comit%C3%A9%20d%27%C3%A9thique%20de%20la%20d%C3%A9fense%20-%20Avis%20int%C3%A9gration%20autonomie%20syst%C3%A8mes%20armes%20l%C3%A9taux%20-%20Version%20anglaise.pdf.pdf
          lang: en
          translation: official
          confidence: EXPLICIT
        - source: fr-comedef-avis-2021
          claim: The Committee judged the renunciation unquestionably sound in light of the principles governing the French armed forces.
          quote: "The Committee regards this decision as unquestionably sound"
          date: 2021-04-29
          url: http://www.defense.gouv.fr/sites/default/files/ministere-armees/20210429_Comit%C3%A9%20d%27%C3%A9thique%20de%20la%20d%C3%A9fense%20-%20Avis%20int%C3%A9gration%20autonomie%20syst%C3%A8mes%20armes%20l%C3%A9taux%20-%20Version%20anglaise.pdf.pdf
          lang: en
          translation: official
          confidence: EXPLICIT
        - source: fr-comedef-avis-2021
          claim: The refusal extends beyond use to the manufacturing and export of fully autonomous lethal systems.
          quote: "Such use, as well as manufacturing and exporting, should be refused."
          date: 2021-04-29
          url: http://www.defense.gouv.fr/sites/default/files/ministere-armees/20210429_Comit%C3%A9%20d%27%C3%A9thique%20de%20la%20d%C3%A9fense%20-%20Avis%20int%C3%A9gration%20autonomie%20syst%C3%A8mes%20armes%20l%C3%A9taux%20-%20Version%20anglaise.pdf.pdf
          lang: en
          translation: official
          confidence: EXPLICIT
        - source: fr-comedef-avis-2021
          claim: Partially autonomous systems are acceptable only if all five guarantees (the "5 Cs" - command, risk control, compliance, competence, confidence) are met.
          quote: "The design and implementation of PALWS should therefore only be contemplated if all the guarantees of their correct use are met"
          date: 2021-04-29
          url: http://www.defense.gouv.fr/sites/default/files/ministere-armees/20210429_Comit%C3%A9%20d%27%C3%A9thique%20de%20la%20d%C3%A9fense%20-%20Avis%20int%C3%A9gration%20autonomie%20syst%C3%A8mes%20armes%20l%C3%A9taux%20-%20Version%20anglaise.pdf.pdf
          lang: en
          translation: official
          confidence: EXPLICIT
  context:
    - note: >
        Origin of the renunciation (opinion footnote 10): the government
        declaration the Committee endorses traces to the Saclay address of
        5 April 2019, where Defence Minister Florence Parly said "Terminator
        will not parade on Bastille Day". Parly likewise, May 2021: "France
        says and will always say no to killer robots." Context-class; the
        opinion is the citing primary; original speech URLs to pin.
    - note: >
        Government adoption (returns 2026-07-19): a Ministry for Europe and
        Foreign Affairs answer to written question QE 8402 (2025) cites the
        2021 Defence Ethics opinion as the standing national reference
        framework and states France continues to contribute actively at the
        GGE. Source questions.assemblee-nationale.fr.
    - note: >
        President Macron, WIRED interview (about 31 March 2018): stated he is
        "categorically opposed" to lethal autonomous weapons to the extent
        they would "abolish all accountability". Context-class head-of-state
        remark; source fr-macron-wired-2018, to be archived.
    - note: >
        2013 origin (honest, downgraded per returns 2026-07-19): the CCW
        agreed its first LAWS mandate at the November 2013 Meeting of High
        Contracting Parties, and France's Ambassador Jean-Hugues
        Simon-Michel chaired the process and led the 2014 Informal Meeting of
        Experts (source fr-ccw-ime-2014; UN Chronicle for the chairing role).
        The stronger "France initiated the debate" framing is not directly
        documented and is not asserted.

