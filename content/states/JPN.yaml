      - source: ccw-gge1-2025-wp7-draftarticles
        claim: Japan is a named author of CCW/GGE.1/2025/WP.7, draft articles specifying prohibitions and regulatory measures to satisfy existing IHL.
        quote: "Affirm the following draft articles on the development, deployment, and use of autonomous weapon systems"
        date: 2025-09-03
        url: https://documents.un.org/api/symbol/access?s=CCW/GGE.1/2025/WP.7&l=en
        lang: en
        translation: none
        confidence: EXPLICIT
      - source: ccw-gge1-2023-wp4rev1-draftarticles
        claim: The draft articles specify measures for States to implement in order to satisfy international humanitarian law as it already stands, rather than obligations a new instrument would create.
        quote: "which specify prohibitions and other regulatory measures for States to implement to effectively satisfy these IHL requirements in armed conflict"
        date: 2023-03-13
        url: https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2023)/CCW_GGE1_2023_WP.4_Rev1.pdf
        lang: en
        translation: none
        confidence: EXPLICIT
        note: >
          The purpose clause is quoted whole rather than cut after
          "regulatory measures", because the truncated form reads as though
          the articles create prohibitions and would overstate the authors'
          position in the same way a cut excerpt of Draft Protocol VI would
          understate the ban camp's. The wording is carried unchanged through
          every revision of the series and is quoted once here, on the
          earliest text this state authored.


