# Slovenia: drafted 2026-10-19 for the analyst of record. approved: false throughout.
iso3: SVN
un_name: SLOVENIA
display_name: Slovenia
coverage_tier: anchor

position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2023-10-23
    approved: true    # analyst approval 2026-10-19, bulk review
    rationale: >
      Slovenia's words leave the kind of instrument open. At the UN
      First Committee in 2023 it backed a stronger mandate for the
      Geneva weapons convention's expert group, one that may lead to
      negotiations on a new international instrument, and in 2025 it
      welcomed the group's progress. It has not said whether that
      instrument should be binding or what it should ban.
    evidence:
      - source: svn-c1-78-cluster4-2023
        claim: Slovenia supports a stronger CCW expert group mandate that may lead to negotiating a new instrument.
        quote: "Slovenia supports a stronger mandate that may lead to negotiations for a new international instrument on this matter."
        date: 2023-10-23
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Eighth_session_(2023)/Slovenia_en.pdf
        lang: en
        translation: none
        confidence: INFERRED
        kind: statement
        note: >
          The statement text is dated only "October 2023"; 2023-10-23 is the
          date the UNODA meetings portal shows. The paragraph frames this
          around the CCW meeting of states parties and the GGE mandate.
      - source: svn-c1-80-general-2025
        claim: In 2025 Slovenia acknowledges the expert group's progress without naming an outcome.
        quote: "Slovenia acknowledges the limited but meaningful progress achieved in the Group of Governmental Experts on Lethal Autonomous Weapons Systems (GGE LAWS)"
        date: 2025-10-13
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Eightieth_session_(2025)/slovenia_eng.pdf
        lang: en
        translation: none
        confidence: INFERRED
        kind: statement

