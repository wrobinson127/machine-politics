    approved: true    # analyst approval 2026-10-19, bulk review
    rationale: >
      In the First Committee's 2023 debate on conventional weapons, Iraq
      called for legally binding rules to deal with lethal autonomous
      weapons, pointing to the risk that they spread or fall into the hands
      of terrorist groups. It did not say the rules should ban anything.
      The statement is in Arabic only, so this reading is a description.
      Iraq voted Yes on all three UN resolutions.
    evidence:
      - source: irq-c1-78-conventional-2023
        claim: Iraq calls for legally binding provisions on lethal autonomous weapons, without naming prohibitions.
        description: >
          Arabic-only national statement in the conventional weapons debate,
          delivered by First Secretary Hamza Habib al-Sadr. After a passage
          on illicit arms trafficking and the ammunition working group, Iraq
          says its delegation calls for establishing legally binding
          provisions to address the challenges of emerging technologies in
          the area of lethal autonomous weapons systems, taking into account
          the risks of their proliferation and of their falling into the
          hands of terrorist groups.
        date: 2023-10-23
        url: https://docs-library.unoda.org/General_Assembly_First_Committee_-Seventy-Eighth_session_(2023)/Iraq.pdf
        lang: ar
        translation: none
        confidence: INFERRED
        kind: statement

