    search_note: >
      Reviewed 2026-10-19: SG submissions under 78/241 (A/79/88 table of contents and the UNODA national files; none filed) and the 79/239 report A/80/78 (none filed; no 79/62 national files for this state found in the UNODA Eightieth session folder); the 2024 Vienna conference statements page (no statement); the Philippine 78/241 submission's account of the December 2023 Manila meeting (no state-attributed view; the full meeting report annex was not opened); First Committee general debate official records A/C.1/78/PV.6 to PV.9 and A/C.1/79/PV.2 to PV.4, PV.9 and PV.10 (Nauru: no statement by this state in those records). Not checked: the 2025 First Committee official records (documents.un.org stopped serving the PV files mid-check), statements to the May 2025 New York informal consultations (meetings.unoda.org pages are script-rendered; the known copies are on a site this review does not use), and the 2026 GGE and Review Conference preparatory meetings. Web searches by state name for a national statement on autonomous weapons, and the Automated Decision Research and SafeGround pages as leads, turned up none. Nauru is a CCW party; no national GGE statement or working paper found. Nauru joined the 42-state joint statement at the September 2025 GGE session calling for negotiations on the rolling text (context only, ruling R3).

