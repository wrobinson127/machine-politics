position_codings:
  - code: AMBIG
    confidence: AMBIGUOUS
    as_of: 2024-04-29
    approved: false
    rationale: >
      The Gambia's own words point two ways. At the Vienna conference in
      April 2024 its defence chief said it will advocate international
      regulation that prohibits autonomous weapons where meaningful
      human control cannot be guaranteed, which points toward a treaty
      with bans. The statement never says those rules should be legally
      binding.
    evidence:
      - source: gmb-vienna-2024-statement
        claim: The Gambia advocates international regulation that prohibits autonomous weapons lacking meaningful human control.
        quote: "an international regulation of autonomous weapons systems that prohibits systems where meaningful human control (MHC) cannot be guaranteed"
        date: 2024-04-29
        url: https://www.bmeia.gv.at/fileadmin/user_upload/Zentrale/Aussenpolitik/Abruestung/AWS_2024/Statements/Gambia_National_Statement.pdf
        lang: en
        translation: none
        confidence: INFERRED
        kind: statement
        note: The sentence opens "The Gambia will joint civilized nations to advocates for" (spelling as in the original).
      - source: gmb-vienna-2024-statement
        claim: The Gambia stresses progress on the legal regulation of autonomous weapons.
        quote: "to underscore the urgency of progress on the legal regulation of autonomous weapons systems to conform with International Humanitarian Law (IHL)"
        date: 2024-04-29
        url: https://www.bmeia.gv.at/fileadmin/user_upload/Zentrale/Aussenpolitik/Abruestung/AWS_2024/Statements/Gambia_National_Statement.pdf
