      itself belongs to the GGE second 2025 session (1 to 5 September),
      and no separate First Committee joint statement was found (FLAG).
      Composition: 39 High Contracting Parties (Brazil delivering,
      Palestine among them as a CCW party) plus three Observer States
      associating themselves. The date is the session opening; the
      statement PDF carries no exact day. Re-verified against the face
      2026-08-24: it reads "on behalf of the following 39 High-Contracting
      Parties" and lists exactly 39, then names Kiribati, Samoa and Thailand
      separately as Observer States. That settles the 42-against-39 split in
      secondary reporting: 39 parties plus 3 observers is 42, so the widely
      quoted 42 folds the observers in. This project reports the face's own
      count. The members list below holds 38 because Palestine, counted
      among the 39, has no board row.
