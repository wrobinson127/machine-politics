# Sponsorship layer (signal 3 of 5): co-sponsor lists as printed on tabled
# drafts, working-paper co-authorship, joint-statement membership. Extracted
# from documents fetched via the UN symbol API and UNODA library; counts and
# name notes are in each record. Membership is fact; meaning stays with the
# reader (invariant 10). Approved by the analyst of record 2026-08-24.
#
# class (analyst ruling 2026-07-20): the "signed/commitment" pie counts only
# commitment-class records (co-sponsorships, signed joint declarations,
# communiques) - what states SIGNED, not what they NEGOTIATE. working_paper
# -class records (CCW GGE draft/negotiating papers, WP.n symbols) stay OUT of
# the pie in both camps; the coalitions-growing story is told on the
# sponsorship surface instead. All records still feed the per-state dossier
# sponsorship/cadence bands regardless of class.
