  - id: reaim-2024-blueprint
    name: REAIM Blueprint for Action
    date: 2024-09-10
    list_source_url: https://www.mofa.go.kr/eng/brd/m_5676/view.do?seq=322676
    list_as_of: 2024-09-10
    approved: true
    list_note: >
      STOP-FLAG. Official sources publish only a count: the ROK Foreign
      Ministry records 61 supporting states without naming them, the summit
      site is offline, and its archive captures are empty shells. No
      per-state rows exist until an official named list is located; named
      lists in secondary sources are not used. China attended and did not
      endorse per its own statements; even that is recorded only when the
      research pass documents it from an official source.
    display_note: >
      Official sources record 61 supporting states. The ROK Foreign Ministry
      announcement publishes the count without naming the states, and this
      project has not located an official named list. Per-state rows appear
      here once one is found.
    states: []

