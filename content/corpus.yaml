# Worldwide document catalogue: the growing-record surface (stacked area) plus
# per-state corpus enrichment. One row per on-record act. Counts group by
# (year, type) for the stacked area. type in:
#   resolution | submission | working_paper | statement | pledge
# Authorship/membership is fact; meaning stays with the reader (invariant 10).
# Everything approved:false until Walker rules; a (year,type) cell renders a
# count only when its enumeration_status is marked complete (honest partial
# over false zero). Source ids resolve against content/sources.yaml.
#
# Session 1 (2026-07-20): submissions lane seeded from A/79/88 Annex I, captured
# in-browser by Walker (docs.un.org rendered text). The SG report reproduces the
# replies received by 25 May 2024. Two replies are joint (a 22-state group and a
# 14-state group); the rest are individual. The European Union reply is an
# observer-organization submission, recorded with author_note (no board row).

