# The Seventh CCW Review Conference, Geneva, 16 to 20 November 2026.
# Drafted 2026-10-19 by tooling for the analyst of record. Nothing renders
# until approved: true, the page and each entry separately.
#
# Daily update path (decision D1): during the conference, each day's entries
# are drafted as link-only facts (date, what happened, the official record),
# approved: false, and the analyst approves the day's batch. No state's
# position changes during the week; a new reading goes through the usual
# review in content/states/.
#
# Facts and quotes below were checked on 2026-10-19 against the documents
# linked; see .scratch/finish/drafts/GGE2026.md for the verbatim extracts.
approved: true    # analyst approval 2026-10-19, packet item 15
title: The Review Conference
description: >-
  The Seventh Review Conference of the Geneva weapons convention, 16 to 20
  November 2026: the documents it starts from and what happens each day,
  linked to the official record.
intro: |
  The Convention on Certain Conventional Weapons (the CCW) is the Geneva treaty under which states have discussed autonomous weapons in an expert group since 2017. Its parties review the treaty every five years. The Seventh Review Conference meets at the Palais des Nations in Geneva from 16 to 20 November 2026, presided over by Ambassador Julien Thöni of Switzerland. Statements will be posted on the [official conference page](https://meetings.unoda.org/meeting/79323/statements).

  This page lists the documents the conference starts from, then what happens each day, each linked to the official record. It records what was said and decided. It does not change any state's position during the week: a new reading goes through the same review as every other one on this site.
before_heading: What the conference starts from
during_heading: During the conference

events:
  - id: gge-final-report-2026
    date: 2026-09-04
    kind: decision
    title: The expert group adopts its final report
    text: >
      The expert group on lethal autonomous weapons systems adopted its
      final report. The report sets out "a set of elements of an
      instrument, without prejudging its nature, and other possible
      measures". It says international humanitarian law "applies fully"
      and that "control and human judgement" are needed. It recommends that
      the Review Conference consider and endorse the elements, and decide
      by consensus on the group's future work.
    links:
      - label: "Final report, CCW/GGE.1/2026/3 (advance copy, 14 September 2026), paras 23, 29, 34, 45 and 46"
        url: "https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2026)/CCW-GGE.1-2026-3-Advance_copy.pdf"
      - label: "Expert group 2026 session documents and statements"
        url: "https://meetings.unoda.org/meeting/79329"
    approved: true    # analyst approval 2026-10-19, packet item 15

  - id: revcon-provisional-agenda
    date: 2026-09-17
    kind: document
    title: The conference agenda and program of work
    text: >
      The preparatory committee endorsed the conference's provisional
      agenda. The expert group's report is item 10, proposals for additional
      protocols are item 14, and the final document is item 20. Under the
      program of work, the committee that covers autonomous weapons meets
      on 17, 18 and 19 November, and the final document is due on Friday
      20 November.
    links:
      - label: "Provisional agenda, CCW/CONF.VII/1"
        url: "https://docs.un.org/en/CCW/CONF.VII/1"
      - label: "Provisional programme of work, CCW/CONF.VII/2"
        url: "https://docs.un.org/en/CCW/CONF.VII/2"
      - label: "Preparatory committee final report, CCW/CONF.VII/PC/3 (advance copy)"
        url: "https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Preparatory_Committee_for_the_Seventh_Review_Conference_(2026)/CCW-CONF.VII-PC-3-Advance_copy.pdf"
    approved: true    # analyst approval 2026-10-19, packet item 15

  # Drafted 2026-11-12 by the pre-conference run. Each was read in full on
  # 2026-11-12 from the link given. approved: false until the analyst flips it.
  - id: revcon-ggelaws-cost-estimates
    date: 2026-10-05
    kind: document
    title: The cost of an expert group in 2027
    text: >
      A conference document sets out what a 2027 session of the expert group
      would cost, so the conference can decide how long it meets: about
      348,700 US dollars for 10 days, 477,000 for 15 days and 607,500 for
      20 days.
    links:
      - label: "Estimated costs, 2027 expert group on autonomous weapons, CCW/CONF.VII/7"
        url: "https://docs.un.org/en/CCW/CONF.VII/7"
    approved: true    # analyst approval 2026-11-12, PR #22

  - id: revcon-gge-mandate-proposal
    date: 2026-10-23
    kind: document
    title: A proposal to negotiate a new protocol
    text: >
      A proposal, listed by UNODA as submitted by the "Chair-designate" on
      23 October, asks the conference to have the expert group "negotiate a
      new Protocol to the Convention" on
      autonomous weapons, building on the elements adopted in 2026. The
      group would meet 15 days a year, work by consensus, and send a draft
      protocol to the 2028 meeting of the parties.
    links:
      - label: "Proposal on the mandate and modalities of the future work of the expert group, paras 2 and 5"
        url: "https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-SeventhReview_Conference_(2026)/Enclosure_-_CCW_7th_Review_Conference_Proposal_GGE_LAWS_Mandate.pdf"
      - label: "Conference document list, UNODA Meetings Place (submit date and author columns)"
        url: "https://meetings.unoda.org/meeting/79323/documents"
    approved: true    # analyst approval 2026-11-12, PR #22

  - id: revcon-draft-final-declaration
    date: 2026-10-28
    kind: document
    title: The draft final declaration
    text: >
      A draft final declaration, listed by UNODA as submitted by the
      "President-designate" on 28 October, welcomes the expert group's work,
      but its paragraph
      and its first decision on autonomous weapons are placeholders, left
      for the conference to fill.
    links:
      - label: "Elements for the final declaration of the Review Conference, draft, para 17, para 50 and Decision 1"
        url: "https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Preparatory_Committee_for_the_Seventh_Review_Conference_(2026)/CCW_-_Draft_final_declaration.pdf"
      - label: "Conference document list, UNODA Meetings Place (submit date and author columns)"
        url: "https://meetings.unoda.org/meeting/79323/documents"
    approved: true    # analyst approval 2026-11-12, PR #22

  - id: revcon-wp2-united-states
    date: 2026-11-04
    kind: document
    state: USA
    title: The United States proposes a non-binding instrument
    text: >
      In a working paper, the United States proposed that the expert group
      keep working by consensus and draft "a non-binding instrument" based on
      the elements it adopted, while states exchange their legal views and
      practice. It argues against a new protocol as the next step.
    links:
      - label: "Working paper submitted by the United States, CCW/CONF.VII/WP.2, paras 4 and 5"
        url: "https://docs.un.org/en/CCW/CONF.VII/WP.2"
    approved: true    # analyst approval 2026-11-12, PR #22
