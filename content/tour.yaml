# The home-page scrollytelling: ten beats on one persistent canvas, one new
# concept per beat, with canvas state carrying across beats.
#
# Copy drafted 2026-08-24, reviewed and APPROVED by the analyst of record the
# same day. Division of labour, per build_site.canvas_teach_sets and
# canvas_stat_sets: the build prints the counts, tallies and teaching lines
# from the dataset. This file carries only the analyst prose, so the copy
# below deliberately does NOT restate figures the chart furniture already
# shows. Prose argues; furniture counts.
#
# Every factual anchor below was checked against the content layer on
# 2026-08-24. Two corrections to the placeholder are noted inline at the
# beats they affect.
approved: true
beats:
  - id: the-question
    title: The question
    copy: >
      Who should be allowed to decide to take a human life? Weapons have
      killed without a person present for a long time, but someone always
      chose the target in advance. What is new is a machine that picks its
      own target and attacks. Governments have argued for a decade over
      whether to allow it. This is the record of what each of them has said,
      and where each has moved.
  - id: one-vote
    title: One country, one vote
    copy: >
      In December 2023 the UN General Assembly voted on autonomous weapons
      for the first time. Resolution 78/241 asked every government to take a
      stand, and the answers went on the record by name. Start with one. The
      United States voted in favour.
  - id: the-glyphs
    title: How to read the marks
    copy: >
      Two more votes followed, one each year. The United States voted in
      favour again in 2024, then against in 2025. On the board, a filled
      disc is a vote in favour, a crossed ring is a vote against, a half-
      filled disc is an abstention, and a faint dash means the state did not
      vote.
  - id: the-canvas
    title: Every country has a row
    copy: >
      The United States is one row of 193. Every row runs left to right
      through the same years, and each state's three votes sit at the dates
      they were cast. Everything else on the board is built on top of these
      rows.
  - id: the-coding
    title: The band is the position
    copy: |
      A vote is one day. Behind it is a position: what the government says it actually wants. This site reads that from what each government has said and draws it as a coloured band under the marks. Each colour is one answer to the same question.

      Blue: wants a treaty that bans some systems.
      Teal: wants a treaty, but has not said what it should ban.
      Ochre: wants new rules, but not a treaty.
      Plum: wants the work kept inside the Geneva weapons convention.
      Brown: wants no new rules at all.
      Hatched: has said things that point in more than one direction.
      Grey: this site looked and found no stated position.

      The United States backed non-binding rules from 2023, so its band starts ochre. In November 2025 it said the work should stay inside the Geneva convention, and the band turns plum. The red seam marks the day that changed. Red on this site means one of two things only: a position changed, or this site corrected its own record.
    # CORRECTION to the placeholder: the earlier copy narrated this shift as a
    # move to OPPOSE with a brown band, sourced provisionally from secondary
    # reporting. The content layer codes it REG-SOFT to CCW-ONLY, EXPLICIT,
    # as_of 2025-11-04, on the primary explanation of vote. Ochre to plum.
  - id: the-mirror
    title: A second country, moving the other way
    copy: >
      India travelled the opposite road on the same three votes: against,
      then an abstention, then in favour. But the two arcs do not show two
      opposite positions. India's position never moved. Its argument was
      always about which forum should do the work, and changing how you vote
      is not the same as changing what you want. That gap between the vote
      and the position is why this site tracks them separately.
    # CORRECTION to the placeholder: its FLAG said India had no coded position
    # in the content layer. India has been coded CCW-ONLY / EXPLICIT since the
    # 2026-07-17 ruling, so the mirror can now be drawn with bands, not marks
    # alone. Note the coded reading: the votes mirror, the positions do not.
  - id: the-movers
    title: The movers
    copy: >
      They are not the only two that moved. Changes caused by missing a vote
      are left out, because missing a vote is not the same as changing your
      mind. The rows are sorted by when each state last moved, most recent
      at the top.
  - id: the-camps
    title: The camps
    copy: >
      One group of states wants a treaty with bans in it. Another wants new
      rules that are not a treaty. A few want no new law at all and say the
      existing laws of war are enough. Where a state has said things that
      point both ways, the board marks it as unclear instead of choosing for
      it. Here the rows are grouped by position, in the order the key lists
      them. That order is a list, not a ranking.
  - id: the-board
    title: Every state, the full board
    copy: >
      Here is the whole record: every member state, every vote, and a
      position band wherever this site has worked one out. An empty track
      means this site has not yet read that state's statements. It says
      nothing about the country.
  - id: the-clock
    title: The clock
    copy: >
      A dated line runs down the right edge. The Geneva weapons convention
      holds its Seventh Review Conference on 16 November 2026, and that is
      the next moment any of this can turn into law. In September 2025,
      Brazil read a statement to the convention's expert group on behalf of
      thirty-nine parties saying they were ready to start negotiating.
      Everything left of the line is on the record. Everything right of it
      is still being decided. From here, open any row for the evidence
      behind it.
    sources:
      - label: "Joint statement to the September 2025 session of the CCW GGE on LAWS (as delivered)"
        url: "https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2025)/Joint_statement_to_the_September_2025_session_of_the_CCW_GGE_LAWS_-_As_delivered.pdf"
    # T3 RESOLVED 2026-08-24. The placeholder claimed 42 parties; secondary
    # sources split between 42 and 39. The as-delivered primary was retrieved
    # and read: it says "on behalf of the following 39 High-Contracting
    # Parties" and lists exactly 39, then names Kiribati, Samoa and Thailand
    # as observer States associating themselves. 39 + 3 observers = 42, which
    # is where the disagreement came from. The beat uses the face's own count
    # and does not fold the observers in. The record of this document is the
    # sponsorship entry joint-statement-gge-sept-2025, which carries the
