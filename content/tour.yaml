# The home-page scrollytelling: ten beats on one persistent canvas, per
# machine_politics_scrollytelling_storyboard.md (authoritative for sequence,
# canvas state, and the single new concept per beat).
#
# Copy drafted 2026-08-24, reviewed and APPROVED by the analyst of record the
# same day. Division of labour, per build_site.canvas_teach_sets and
# canvas_stat_sets: the build prints the counts, tallies and teaching lines
# from the dataset. This file carries only the analyst prose, so the copy
# below deliberately does NOT restate figures the chart furniture already
# shows. Prose argues; furniture counts.
#
# Every factual anchor below was checked against the content layer on
# 2026-08-24. Two corrections to the placeholder are noted inline at the
# beats they affect.
approved: true
beats:
  - id: the-question
    title: The question
    copy: >
      Who should be allowed to decide to take a human life? Weapons have
      killed without a person present for a long time, but the choice of
      target was always made by someone, somewhere, in advance. What is new
      is a machine that selects and engages a target on its own judgment.
      Governments have spent a decade arguing over whether to permit it.
      This is the record of what each of them has actually said, and where
      each of them has moved.
  - id: one-vote
    title: One country, one vote
    copy: >
      In December 2023 the General Assembly voted on autonomous weapons for
      the first time. Resolution 78/241 asked governments to state a view, and
      for the first time the answers went on the record by name. Start with
      one of them. The United States voted in favour.
  - id: the-glyphs
    title: The mark teaches itself
    copy: >
      Two more votes followed, one each year. The United States voted in
      favour again in 2024, then against in 2025. A filled disc is a vote in
      favour, a crossed ring is a vote against, a half-filled disc is an
      abstention, and a faint dash is a state that did not vote. The shapes
      sit beside the words that name them, so there is nothing to memorise
      and no key to consult.
  - id: the-canvas
    title: The row persists
    copy: >
      Hold onto that row. Every country has one, running left to right
      through the same decade. Nothing on this canvas is cleared or redrawn
      from scratch as you read. What you have already learned to read stays
      readable.
  - id: the-coding
    title: 'Color arrives: position, not vote'
    copy: >
      A vote is an act on a single day. Behind it sits a stated position,
      which this project codes from the public record and shows as a band
      beneath the marks. The United States backed non-binding measures from
      2023, and in November 2025 it set out a preference for keeping the work
      inside the Convention on Certain Conventional Weapons. The band changes
      color there. The red seam marks the moment the position moved. Red is
      reserved on this site: it marks a change of position, or a correction
      to this project's own record, and nothing else.
    # CORRECTION to the placeholder: the earlier copy narrated this shift as a
    # move to OPPOSE with a brown band, sourced provisionally from secondary
    # reporting. The content layer codes it REG-SOFT to CCW-ONLY, EXPLICIT,
    # as_of 2025-11-04, on the primary explanation of vote. Ochre to plum.
  - id: the-mirror
    title: A second country, moving the other way
    copy: >
      India travelled the opposite road on the same three votes: against,
      then an abstention, then in favour. Two states, two arcs, crossing in
      the middle. What they do not show is two opposite positions. India's
      coded position held steady throughout, because its argument was always
      about which forum should do the work, and a change in how a state votes
      is not by itself a change in what it wants. That gap between the act and
      the position is the reason this site codes them separately.
    # CORRECTION to the placeholder: its FLAG said India had no coded position
    # in the content layer. India has been coded CCW-ONLY / EXPLICIT since the
    # 2026-07-17 ruling, so the mirror can now be drawn with bands, not marks
    # alone. Note the coded reading: the votes mirror, the positions do not.
  - id: the-movers
    title: The movers
    copy: >
      They are not the only two that moved. Attendance changes are left out
      of this count, because missing a vote is not the same as changing your
      mind. The rows arrive sorted by when each state last moved, so the
      most recently unsettled sit at the top. Every glyph on screen was
      taught in the beats above.
  - id: the-camps
    title: The camps resolve
    copy: >
      Step back from the movement and structure appears. One group of states
      wants a binding treaty with prohibitions in it. Another wants new
      international measures that are not legally binding. A few want no new
      law at all, and hold that the law of armed conflict already covers
      this. Some are genuinely hard to read, and this site says so rather
      than picking for them. The rows sort by coded position. They are
      described in the order the axis runs, and never ranked.
  - id: the-board
    title: Every state, the full board
    copy: >
      Here is the whole record: every member state, every recorded vote, and
      a position band wherever this project has coded one. Where no band
      appears, the track is left honestly empty. That is not a finding about
      the country. It is a statement about how far this project has read, and
      it marks the work still open.
  - id: the-clock
    title: The clock
    copy: >
      A dated line runs down the right edge. The Seventh Review Conference of
      the Convention on Certain Conventional Weapons opens in Geneva on 16
      November 2026, and it is the next moment at which any of this can turn
      into law. In September 2025, Brazil read a statement to the expert
      group on behalf of thirty-nine parties saying they were ready to begin
      negotiating. Everything to the left of that line is on the record.
      Everything to the right is still being decided. The board is yours from
      here: choose any row for the evidence behind it.
    sources:
      - label: "Joint statement to the September 2025 session of the CCW GGE on LAWS (as delivered)"
        url: "https://docs-library.unoda.org/Convention_on_Certain_Conventional_Weapons_-Group_of_Governmental_Experts_on_Lethal_Autonomous_Weapons_Systems_(2025)/Joint_statement_to_the_September_2025_session_of_the_CCW_GGE_LAWS_-_As_delivered.pdf"
    # T3 RESOLVED 2026-08-24. The placeholder claimed 42 parties; secondary
    # sources split between 42 and 39. The as-delivered primary was retrieved
    # and read: it says "on behalf of the following 39 High-Contracting
    # Parties" and lists exactly 39, then names Kiribati, Samoa and Thailand
    # as observer States associating themselves. 39 + 3 observers = 42, which
    # is where the disagreement came from. The beat uses the face's own count
    # and does not fold the observers in. The record of this document is the
    # sponsorship entry joint-statement-gge-sept-2025, which carries the
    # roster, the archived snapshot and the Palestine handling.
