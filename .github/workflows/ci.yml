name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tools/tests -q
      - run: python tools/validate_content.py
      - name: Build site and assert committed artifact is fresh
        run: |
          python tools/build_site.py
          git diff --exit-code -- site/
