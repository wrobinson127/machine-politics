name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tools/tests -q
      - name: Build site (when the build entrypoint exists)
        run: |
          if [ -f tools/build_site.py ]; then
            python tools/build_site.py
          else
            echo "build entrypoint not present yet; skipping"
          fi
